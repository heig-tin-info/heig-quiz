name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default; a job that needs more (the image push, the deploys)
# declares it.
permissions:
  contents: read

# A new push to a pull request cancels the run it supersedes. Every run on
# main keeps a group of its own: it is never cancelled nor queued behind
# another, since each carries its own deploy (and may wait for approval).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether this run tests the code at all. On a pull request that changes
  # only prose (docs/, mockups/, a Markdown file outside the sources), the
  # jobs below are skipped and `checks` still reports success, so a docs PR
  # is never blocked. On a push to main everything always runs: nothing is
  # deployed that the full suite did not pass. The Markdown under a `src/`
  # is code: apps/web imports its help pages (help.tsx).
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' || steps.filter.outputs.src-prose == 'true' }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          # A file counts for `code` when it matches EVERY pattern below.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!mockups/**'
              - '!**/*.md'
            src-prose:
              - '{apps,packages}/*/src/**/*.md'

  # The whole build (the SPA and the API included) and the typecheck: what
  # the image will be made of must compile, whatever the tests say.
  build-typecheck:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # The browser runtimes `pnpm build` downloads (77 MB), keyed on the
      # script whose pinned digests name them.
      - uses: actions/cache@v6
        with:
          path: apps/web/public/runtimes
          key: web-runtimes-${{ hashFiles('apps/web/scripts/fetch-runtimes.mjs') }}
      # Strict, so a partial download fails here instead of being cached.
      - run: node apps/web/scripts/fetch-runtimes.mjs --strict
      - run: pnpm build
      - run: pnpm typecheck

  # The API's and the SPA's suites, sharded, run side by side: in one job,
  # the API's db tests (each loading a PGlite, src/test/template.ts) and the
  # SPA's jsdom tests took six minutes. The API gets four shards, the SPA
  # three: with three each, the API shard holding the big db suites was the
  # critical path at 6.5 minutes against 3 to 4 for every other job. Each
  # shard builds only the workspace packages its app imports (the tests
  # resolve them through dist/), which costs less than waiting for `build`.
  test-app:
    name: test-${{ matrix.pkg }} (${{ matrix.shard }}/${{ matrix.shards }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pkg: api, shard: 1, shards: 4 }
          - { pkg: api, shard: 2, shards: 4 }
          - { pkg: api, shard: 3, shards: 4 }
          - { pkg: api, shard: 4, shards: 4 }
          - { pkg: web, shard: 1, shards: 3 }
          - { pkg: web, shard: 2, shards: 3 }
          - { pkg: web, shard: 3, shards: 3 }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm --filter "@quiz/${{ matrix.pkg }}^..." build
      - run: pnpm --filter "@quiz/${{ matrix.pkg }}" test --shard=${{ matrix.shard }}/${{ matrix.shards }}

  # Every other package's `test`: the question types, domain, contracts, ui,
  # diagram, docrender, registry, the runner's and the codespace portal's
  # unit suites, and the kiosk extension's plain-Node tests
  # (extensions/kiosk-attestation). The runner's integration suite
  # (`test:integration`, real containers) is NOT run here, so that an image
  # build never holds up every PR: it has its own workflow,
  # runner-integration.yml (#234). The portal's (`CODESPACE_INTEGRATION=1`,
  # rootful Podman and a forge) runs in no workflow yet (M6-04).
  test-rest:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm -r --filter "!@quiz/api" --filter "!@quiz/web" build
      - run: pnpm -r --filter "!@quiz/api" --filter "!@quiz/web" test
      # Not a workspace package: no dependency, no build (its README).
      - run: node --test extensions/kiosk-attestation/*.test.mjs

  # The ONE required status check (the `main` ruleset names `checks`), and
  # what `image` waits for. It passes when every job above passed, or when
  # they were all skipped because a pull request changed prose only; a
  # failed, cancelled or unexpectedly skipped job fails it.
  checks:
    if: always()
    needs: [changes, build-typecheck, test-app, test-rest]
    runs-on: ubuntu-latest
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          RESULTS: ${{ needs.build-typecheck.result }} ${{ needs.test-app.result }} ${{ needs.test-rest.result }}
        run: |
          echo "changes: $CHANGES (code: $CODE); build-typecheck, test-app, test-rest: $RESULTS"
          [ "$CHANGES" = success ] || exit 1
          for result in $RESULTS; do
            case "$result" in
              success) ;;
              skipped) [ "$CODE" = false ] || exit 1 ;;
              *) exit 1 ;;
            esac
          done

  # Production images, built HERE and pushed to GHCR: the VM must never build.
  # The two images are independent, so they build side by side, each with a
  # buildx layer cache of its own (`scope`): sharing one scope, each export
  # replaced the other's and the next build of either started cold.
  image:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: quiz
            file: Dockerfile
          # The runner service: a second, small image. It carries no engine,
          # only the pinned `podman-remote` client that talks to the VM's
          # rootful socket (apps/runner/README.md).
          - image: quiz-runner
            file: apps/runner/Dockerfile
    steps:
      - uses: actions/checkout@v7
      # The commit and its date, baked into the SPA and the API (#179,
      # ADR-055); the runner's Dockerfile takes neither.
      - id: commit
        if: matrix.image == 'quiz'
        run: |
          {
            echo "args<<EOF"
            echo "COMMIT_SHA=$GITHUB_SHA"
            echo "COMMIT_DATE=$(git log -1 --format=%cI)"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          build-args: ${{ steps.commit.outputs.args }}
          # :latest for the regular deploy, :<sha> kept for rollbacks.
          tags: |
            ghcr.io/heig-tin-info/${{ matrix.image }}:latest
            ghcr.io/heig-tin-info/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  # Deploy, in two steps (ADR-028): every push to main goes to STAGING
  # (quiz.dev.chevallier.io) automatically; the SAME sha goes to PRODUCTION
  # once a human approves the `production` environment's deployment (a
  # required reviewer, set in the repository settings). Rollback is a re-run
  # of an older run's `deploy-production` job: same sha, same image.
  #
  # Each VM's authorized_keys pins a CI key to a script (forced commands) —
  # a key can ONLY deploy, never open a shell:
  #   staging key    → ~/quiz-staging/deploy.sh staging           (app VM, srvstg)
  #   production key → /srv/quiz/deploy.sh production             (app VM, srv)
  #                  → /opt/quiz-runner/apps/runner/deploy/deploy.sh (code VM)
  # Staging runs as its OWN account, with its own rootless Docker: it executes
  # every commit of main before any approval, so it must not share the account
  # that owns production's secrets, volumes and backups.
  # The SSH command is "<sha> <ephemeral GHCR token>" (→ $SSH_ORIGINAL_COMMAND):
  # the commit to deploy, and a pull credential stored nowhere. Without its
  # key a job no-ops, so the pipeline stays green until keys are provisioned.
  deploy-staging:
    needs: image
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_URL || 'https://quiz.dev.chevallier.io' }}
    permissions:
      contents: read
      packages: read
    concurrency:
      group: staging-deploy
      cancel-in-progress: false
    env:
      DEPLOY_SSH_KEY: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_HOST_KEY: ${{ vars.DEPLOY_HOST_KEY }}
      STAGING_URL: ${{ vars.STAGING_URL || 'https://quiz.dev.chevallier.io' }}
    steps:
      - name: Skip when the staging key is not configured
        if: env.DEPLOY_SSH_KEY == '' || env.DEPLOY_HOST == ''
        run: echo "::notice::STAGING_DEPLOY_SSH_KEY/DEPLOY_HOST not set — staging deploy skipped."
      - name: Set up SSH (pinned host key)
        if: env.DEPLOY_SSH_KEY != '' && env.DEPLOY_HOST != ''
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s %s\n' "$DEPLOY_HOST" "$DEPLOY_HOST_KEY" >> ~/.ssh/known_hosts
      - name: Deploy to staging (forced command runs ~/quiz-staging/deploy.sh staging)
        if: env.DEPLOY_SSH_KEY != '' && env.DEPLOY_HOST != ''
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No fallback account: an unset variable fails the deploy loudly,
          # and never falls back to production's account.
          DEPLOY_USER: ${{ vars.STAGING_DEPLOY_USER }}
        run: ssh -i ~/.ssh/id_ed25519 "${DEPLOY_USER:?vars.STAGING_DEPLOY_USER is not set}"@"$DEPLOY_HOST" "$GITHUB_SHA $GHCR_TOKEN"
      # The gate: a staging that does not come up healthy (a migration that
      # fails on production-shaped data, a crash at boot) stops the promotion.
      - name: Staging answers healthy
        if: env.DEPLOY_SSH_KEY != '' && env.DEPLOY_HOST != ''
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "$STAGING_URL/healthz"; then exit 0; fi
            sleep 5
          done
          echo "::error::$STAGING_URL/healthz did not answer 200 within 150 s"
          exit 1

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    # The approval gate: the job waits here until a required reviewer of the
    # `production` environment approves it (repository settings).
    environment:
      name: production
      url: https://quiz.chevallier.io
    permissions:
      contents: read
      packages: read
    # A job waiting for approval already holds the group, so without
    # cancel-in-progress a promotion left unapproved blocks every later one
    # (they sit "pending", with no Review button). The newest promotion wins:
    # it carries every older commit. The price is that a push landing while a
    # production deploy is running cancels it; the newer job then deploys.
    concurrency:
      group: prod-deploy
      cancel-in-progress: true
    env:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_HOST_KEY: ${{ vars.DEPLOY_HOST_KEY }}
      DEPLOY_RUNNER_HOST: ${{ vars.DEPLOY_RUNNER_HOST }}
      DEPLOY_RUNNER_HOST_KEY: ${{ vars.DEPLOY_RUNNER_HOST_KEY }}
    steps:
      - name: Skip when the deploy key is not configured
        if: env.DEPLOY_SSH_KEY == '' || env.DEPLOY_HOST == ''
        run: echo "::notice::DEPLOY_SSH_KEY/DEPLOY_HOST not set — image pushed, deploy skipped."
      - name: Set up SSH (pinned host key)
        if: env.DEPLOY_SSH_KEY != '' && env.DEPLOY_HOST != ''
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s %s\n' "$DEPLOY_HOST" "$DEPLOY_HOST_KEY" >> ~/.ssh/known_hosts
          if [ -n "$DEPLOY_RUNNER_HOST" ]; then
            printf '%s %s\n' "$DEPLOY_RUNNER_HOST" "$DEPLOY_RUNNER_HOST_KEY" >> ~/.ssh/known_hosts
          fi
      - name: Deploy the application (forced command runs deploy.sh on the quiz VM)
        if: env.DEPLOY_SSH_KEY != '' && env.DEPLOY_HOST != ''
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No fallback account: an unset variable fails the deploy loudly.
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          # deploy.sh refuses to restart production under a live evaluation
          # (exit 3, the job fails, the runner step is skipped). Setting this
          # variable to THIS run's sha, then re-running the job, forces it;
          # any other value forces nothing (deploy.md §5).
          DEPLOY_FORCE_SHA: ${{ vars.DEPLOY_FORCE_SHA }}
        run: |
          force=
          if [ "$DEPLOY_FORCE_SHA" = "$GITHUB_SHA" ]; then
            force="force "
            echo "::warning::DEPLOY_FORCE_SHA names this sha: the live-evaluation guard is overridden."
          fi
          ssh -i ~/.ssh/id_ed25519 "${DEPLOY_USER:?vars.DEPLOY_USER is not set}"@"$DEPLOY_HOST" "${force}$GITHUB_SHA $GHCR_TOKEN"
      - name: Deploy the runner (forced command runs apps/runner/deploy/deploy.sh on the code VM)
        if: env.DEPLOY_SSH_KEY != '' && env.DEPLOY_HOST != '' && env.DEPLOY_RUNNER_HOST != ''
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ssh -i ~/.ssh/id_ed25519 root@"$DEPLOY_RUNNER_HOST" "$GITHUB_SHA $GHCR_TOKEN"
