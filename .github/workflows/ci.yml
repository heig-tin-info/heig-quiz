name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default; a job that needs more (the image push, the deploys)
# declares it.
permissions:
  contents: read

# A new push to a pull request cancels the run it supersedes. Every run on
# main keeps a group of its own: it is never cancelled nor queued behind
# another, since each carries its own deploy (and may wait for approval).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # The browser runtimes `pnpm build` downloads (77 MB), keyed on the
      # script whose pinned digests name them.
      - uses: actions/cache@v6
        with:
          path: apps/web/public/runtimes
          key: web-runtimes-${{ hashFiles('apps/web/scripts/fetch-runtimes.mjs') }}
      - run: pnpm install --frozen-lockfile
      # Strict, so a partial download fails here instead of being cached.
      - run: node apps/web/scripts/fetch-runtimes.mjs --strict
      - run: pnpm build
      - run: pnpm typecheck
      # Every package's `test`, the runner's unit suite included. Its
      # integration suite (`test:integration`, real containers) is deliberately
      # NOT run on CI: it skips itself without a Podman socket anyway.
      - run: pnpm test

  # Production images, built HERE and pushed to GHCR: the VM must never build.
  image:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # The commit date, baked into the SPA beside the sha (#179).
      - id: commit
        run: echo "date=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            COMMIT_DATE=${{ steps.commit.outputs.date }}
          # :latest for the regular deploy, :<sha> kept for rollbacks.
          tags: |
            ghcr.io/heig-tin-info/quiz:latest
            ghcr.io/heig-tin-info/quiz:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The runner service: a second, small image. It carries no engine, only
      # the pinned `podman-remote` client that talks to the VM's rootful
      # socket (apps/runner/README.md).
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/runner/Dockerfile
          push: true
          tags: |
            ghcr.io/heig-tin-info/quiz-runner:latest
            ghcr.io/heig-tin-info/quiz-runner:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy, in two steps (ADR-028): every push to main goes to STAGING
  # (quiz.dev.chevallier.io) automatically; the SAME sha goes to PRODUCTION
  # once a human approves the `production` environment's deployment (a
  # required reviewer, set in the repository settings). Rollback is a re-run
  # of an older run's `deploy-production` job: same sha, same image.
  #
  # Each VM's authorized_keys pins a CI key to a script (forced commands) —
  # a key can ONLY deploy, never open a shell:
  #   staging key    → ~/quiz-staging/deploy.sh staging           (app VM, srvstg)
  #   production key → /srv/quiz/deploy.sh production             (app VM, srv)
  #                  → /opt/quiz-runner/apps/runner/deploy/deploy.sh (code VM)
  # Staging runs as its OWN account, with its own rootless Docker: it executes
  # every commit of main before any approval, so it must not share the account
  # that owns production's secrets, volumes and backups.
  # The SSH command is "<sha> <ephemeral GHCR token>" (→ $SSH_ORIGINAL_COMMAND):
  # the commit to deploy, and a pull credential stored nowhere. Without its
  # key a job no-ops, so the pipeline stays green until keys are provisioned.
  deploy-staging:
    needs: image
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_URL || 'https://quiz.dev.chevallier.io' }}
    permissions:
      contents: read
      packages: read
    concurrency:
      group: staging-deploy
      cancel-in-progress: false
    env:
      DEPLOY_SSH_KEY: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_HOST_KEY: ${{ vars.DEPLOY_HOST_KEY }}
      STAGING_URL: ${{ vars.STAGING_URL || 'https://quiz.dev.chevallier.io' }}
    steps:
      - name: Skip when the staging key is not configured
        if: env.DEPLOY_SSH_KEY == '' || env.DEPLOY_HOST == ''
        run: echo "::notice::STAGING_DEPLOY_SSH_KEY/DEPLOY_HOST not set — staging deploy skipped."
      - name: Set up SSH (pinned host key)
        if: env.DEPLOY_SSH_KEY != '' && env.DEPLOY_HOST != ''
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s %s\n' "$DEPLOY_HOST" "$DEPLOY_HOST_KEY" >> ~/.ssh/known_hosts
      - name: Deploy to staging (forced command runs ~/quiz-staging/deploy.sh staging)
        if: env.DEPLOY_SSH_KEY != '' && env.DEPLOY_HOST != ''
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No fallback account: an unset variable fails the deploy loudly,
          # and never falls back to production's account.
          DEPLOY_USER: ${{ vars.STAGING_DEPLOY_USER }}
        run: ssh -i ~/.ssh/id_ed25519 "${DEPLOY_USER:?vars.STAGING_DEPLOY_USER is not set}"@"$DEPLOY_HOST" "$GITHUB_SHA $GHCR_TOKEN"
      # The gate: a staging that does not come up healthy (a migration that
      # fails on production-shaped data, a crash at boot) stops the promotion.
      - name: Staging answers healthy
        if: env.DEPLOY_SSH_KEY != '' && env.DEPLOY_HOST != ''
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "$STAGING_URL/healthz"; then exit 0; fi
            sleep 5
          done
          echo "::error::$STAGING_URL/healthz did not answer 200 within 150 s"
          exit 1

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    # The approval gate: the job waits here until a required reviewer of the
    # `production` environment approves it (repository settings).
    environment:
      name: production
      url: https://quiz.chevallier.io
    permissions:
      contents: read
      packages: read
    concurrency:
      group: prod-deploy
      cancel-in-progress: false
    env:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_HOST_KEY: ${{ vars.DEPLOY_HOST_KEY }}
      DEPLOY_RUNNER_HOST: ${{ vars.DEPLOY_RUNNER_HOST }}
      DEPLOY_RUNNER_HOST_KEY: ${{ vars.DEPLOY_RUNNER_HOST_KEY }}
    steps:
      - name: Skip when the deploy key is not configured
        if: env.DEPLOY_SSH_KEY == '' || env.DEPLOY_HOST == ''
        run: echo "::notice::DEPLOY_SSH_KEY/DEPLOY_HOST not set — image pushed, deploy skipped."
      - name: Set up SSH (pinned host key)
        if: env.DEPLOY_SSH_KEY != '' && env.DEPLOY_HOST != ''
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s %s\n' "$DEPLOY_HOST" "$DEPLOY_HOST_KEY" >> ~/.ssh/known_hosts
          if [ -n "$DEPLOY_RUNNER_HOST" ]; then
            printf '%s %s\n' "$DEPLOY_RUNNER_HOST" "$DEPLOY_RUNNER_HOST_KEY" >> ~/.ssh/known_hosts
          fi
      - name: Deploy the application (forced command runs deploy.sh on the quiz VM)
        if: env.DEPLOY_SSH_KEY != '' && env.DEPLOY_HOST != ''
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No fallback account: an unset variable fails the deploy loudly.
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          # deploy.sh refuses to restart production under a live evaluation
          # (exit 3, the job fails, the runner step is skipped). Setting this
          # variable to THIS run's sha, then re-running the job, forces it;
          # any other value forces nothing (deploy.md §5).
          DEPLOY_FORCE_SHA: ${{ vars.DEPLOY_FORCE_SHA }}
        run: |
          force=
          if [ "$DEPLOY_FORCE_SHA" = "$GITHUB_SHA" ]; then
            force="force "
            echo "::warning::DEPLOY_FORCE_SHA names this sha: the live-evaluation guard is overridden."
          fi
          ssh -i ~/.ssh/id_ed25519 "${DEPLOY_USER:?vars.DEPLOY_USER is not set}"@"$DEPLOY_HOST" "${force}$GITHUB_SHA $GHCR_TOKEN"
      - name: Deploy the runner (forced command runs apps/runner/deploy/deploy.sh on the code VM)
        if: env.DEPLOY_SSH_KEY != '' && env.DEPLOY_HOST != '' && env.DEPLOY_RUNNER_HOST != ''
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ssh -i ~/.ssh/id_ed25519 root@"$DEPLOY_RUNNER_HOST" "$GITHUB_SHA $GHCR_TOKEN"
