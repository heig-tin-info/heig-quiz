name: Runner integration

# The Podman integration suite of apps/runner (`test:integration`): real
# containers, under the real seccomp profile, on a ROOTFUL socket so that
# `--userns=auto` is the production one (#234). A workflow of its own, not a
# job of ci.yml: it never holds up `checks`, and nothing in the deploy chain
# (image → deploy-staging → deploy-production) waits for it or shares its
# concurrency group.
#
# A PR that touches the runner (profile, engine, images) runs it; so does a
# weekly run, which also rebuilds the images from Alpine's current packages
# (a new rustc, a new ngspice) and seeds the week's image cache on main.

on:
  pull_request:
    paths:
      - "apps/runner/**"
      - "packages/core/src/runner.ts"
      - ".github/workflows/runner-integration.yml"
  schedule:
    # Mondays 04:17 UTC, off the hour to dodge the scheduler's rush.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner-integration-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  podman:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PODMAN_SOCKET: /run/podman/podman.sock
      PODMAN_REMOTE_URL: unix:///run/podman/podman.sock
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The runner and what it imports (@quiz/core), nothing else: no SPA, no
      # browser runtimes.
      - run: pnpm --filter "@quiz/runner..." build

      # The rootful engine, as on the code VM. `--userns=auto` carves its
      # ranges from the `containers` entry of /etc/subuid and /etc/subgid,
      # which the Ubuntu package does not create; production has it. The
      # socket is handed to the job's user so the suite (and build.sh) can
      # drive it with `--remote`, exactly as the service does (invariant 13).
      # Nothing about the SANDBOX containers is relaxed: they get the flags of
      # `containerArgs()`, asserted by engine.test.ts.
      - name: Start the rootful Podman socket
        run: |
          podman --version
          for f in /etc/subuid /etc/subgid; do
            grep -q '^containers:' "$f" || echo 'containers:2147483647:2147483648' | sudo tee -a "$f" >/dev/null
          done
          sudo systemctl start podman.socket
          sudo chmod o+x /run/podman
          sudo chown "$(id -u)" "$PODMAN_SOCKET"
          podman --remote --url "$PODMAN_REMOTE_URL" info --format '{{.Host.Security.Rootless}} {{.Host.CgroupsVersion}} {{.Host.OCIRuntime.Name}}'

      # The language images, cached as ONE `podman save -m` archive (the
      # Alpine layer is stored once) in the GitHub Actions cache. The key is
      # the image sources plus the ISO week: a PR that changes a Containerfile
      # or build.sh misses and builds; otherwise the week's archive is reused,
      # and the weekly run, on a fresh key, rebuilds from Alpine's current
      # packages. rust (~820 MB) is most of it; the archive is ~1.5 GB before
      # the cache's own compression, well inside the 10 GB a repository gets.
      - id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      # Restore and save are separate steps so that the archive is saved as
      # soon as it is built: a red suite (the very case this job exists for)
      # does not throw the build away.
      - id: images-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/runner-images.tar
          key: runner-images-${{ hashFiles('apps/runner/images/**') }}-${{ steps.week.outputs.week }}
      - name: Load the cached language images
        if: steps.images-cache.outputs.cache-hit == 'true'
        run: podman --remote --url "$PODMAN_REMOTE_URL" load -i "$RUNNER_TEMP/runner-images.tar"
      - name: Build the language images, rust included
        if: steps.images-cache.outputs.cache-hit != 'true'
        run: |
          apps/runner/images/build.sh c cpp python js spice rust
          podman --remote --url "$PODMAN_REMOTE_URL" save -m -o "$RUNNER_TEMP/runner-images.tar" \
            quiz-runner-c:latest quiz-runner-cpp:latest quiz-runner-python:latest \
            quiz-runner-js:latest quiz-runner-spice:latest quiz-runner-rust:latest
      - if: steps.images-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/runner-images.tar
          key: ${{ steps.images-cache.outputs.cache-primary-key }}
      - run: podman --remote --url "$PODMAN_REMOTE_URL" images

      # The suite SKIPS a language whose image is missing, and falls back to no
      # `--userns=auto` on a rootless engine: both would turn this job green
      # while testing less. So the engine line it prints is checked — rootful,
      # remote, userns=auto, every language — and so is the skip count.
      - name: Integration suite
        run: |
          pnpm --filter @quiz/runner test:integration 2>&1 | tee "$RUNNER_TEMP/integration.log"
          grep -q 'rootless=false, remote=true, userns=auto:true, .*languages=c,cpp,python,js,rust,spice$' "$RUNNER_TEMP/integration.log" \
            || { echo "::error::the suite did not run on a rootful engine with userns=auto and all six images"; exit 1; }
          if grep -Eq 'Tests .*[0-9]+ skipped' "$RUNNER_TEMP/integration.log"; then
            echo "::error::some integration tests were skipped"; exit 1
          fi
