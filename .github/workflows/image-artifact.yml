# Keyless deploy fallback: builds the production image and publishes it as a
# run artifact, so an operator can `gh run download` it and `docker load` it
# on the VM without any registry credentials. The normal path is the CI
# image+deploy jobs (ci.yml); this exists for bootstrap and emergencies.
name: Image artifact

on:
  workflow_dispatch:

# Least privilege: the checkout reads the repository; the artifact upload
# uses the run's own artifact token, not this one. Nothing is pushed.
permissions:
  contents: read

jobs:
  image-tar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          tags: ghcr.io/heig-tin-info/quiz:latest
          outputs: type=docker,dest=/tmp/quiz-image.tar
          # No layer cache, like ci.yml's `image` job (audit M8): an image
          # meant for production is built cold from the commit alone.
      - uses: actions/upload-artifact@v7
        with:
          name: quiz-image
          path: /tmp/quiz-image.tar
          compression-level: 6
          retention-days: 3
