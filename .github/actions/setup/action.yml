name: Set up the workspace
description: >
  pnpm, Node 24 with the pnpm store cached (keyed on the lockfile), and the
  frozen install every job of ci.yml starts from. The checkout comes first,
  in the job itself: this action lives in the repository.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
