<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Classes UML</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#eef1f3; --side:#e2e7eb; --ink:#17212b; --muted:#66727d; --rule:#cfd7dd;
  --grid:#dde3e8; --grid2:#c9d2d9; --accent:#2f5bea; --accent-soft:rgba(47,91,234,.10);
  --btn:#f5f7f8; --btn-h:#ffffff; --card:#fbfcfd; --head:#e3e9f1; --bad:#b93815;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#10161b; --side:#151c22; --ink:#d9e2e8; --muted:#8a97a2; --rule:#26313a;
    --grid:#182128; --grid2:#223039; --accent:#7f9dff; --accent-soft:rgba(127,157,255,.14);
    --btn:#1b242b; --btn-h:#222d35; --card:#141c22; --head:#1b2630; --bad:#f0936b; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#10161b; --side:#151c22; --ink:#d9e2e8; --muted:#8a97a2; --rule:#26313a;
  --grid:#182128; --grid2:#223039; --accent:#7f9dff; --accent-soft:rgba(127,157,255,.14);
  --btn:#1b242b; --btn-h:#222d35; --card:#141c22; --head:#1b2630; --bad:#f0936b; color-scheme:dark;
}
html{height:100%}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{height:100%;margin:0;background:var(--paper);color:var(--ink);
  font:14px/1.45 "Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
.app{display:grid;grid-template-columns:240px 1fr;height:100%}

aside{background:var(--side);border-right:1px solid var(--rule);overflow-y:auto;user-select:none;
  display:flex;flex-direction:column;gap:20px;padding:20px 16px 18px}
.brand h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em}
.brand p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
aside h2{margin:0 0 8px;font-size:12.5px;font-weight:600;color:var(--muted)}
button{font:inherit;color:inherit}
.act{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--rule);background:var(--btn);
  border-radius:6px;padding:6px 9px;cursor:pointer;text-align:left;font-size:13px}
.act:hover{background:var(--btn-h)}
.act:disabled{opacity:.45;cursor:default}
.acts{display:grid;grid-template-columns:1fr;gap:5px}

/* segmented controls: the diagram type, and the two views of one diagram */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;padding:2px;border:1px solid var(--rule);
  border-radius:7px;background:var(--btn)}
.seg button{border:0;background:none;padding:6px 8px;border-radius:5px;font-size:12.5px;font-weight:500;
  color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
.seg.vert{grid-auto-flow:row}
.seg.vert button{text-align:left;padding:6px 10px}

/* the toolbox: icons only, the student is expected to know the notation */
.tb{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tb4{grid-template-columns:repeat(4,1fr)}
.types{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.tbb{display:flex;align-items:center;justify-content:center;height:46px;padding:0;border:1px solid var(--rule);
  background:var(--btn);border-radius:6px;cursor:pointer;touch-action:none;color:var(--ink)}
.tb4 .tbb{height:38px}
.types .tbb{height:32px}
.tbb:hover{background:var(--btn-h)}
.tbb:disabled{opacity:.4;cursor:default}
.tbb.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.tbb svg{width:44px;height:30px;display:block}
.tb4 .tbb svg{width:20px;height:20px}
.types .tbb svg{width:30px;height:20px}
.tbb .ico{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.tbb .ilab{font:500 6.5px "Archivo",sans-serif;fill:currentColor;text-anchor:middle}
.tbb .hd.tri,.tbb .hd.dia{fill:var(--btn)}
.tbb .uc{fill:var(--btn)}
.tbb.on .rln,.tbb.on .hd,.tbb.on .uc{stroke:var(--accent)}
.tbb.on .hd.diaF{fill:var(--accent)}
.help{margin-top:auto;color:var(--muted);font-size:12px;line-height:1.6}
.help div{display:flex;justify-content:space-between;gap:8px;white-space:nowrap}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

main{position:relative;overflow:hidden;min-width:0}
#cv{display:block;width:100%;height:100%;touch-action:none;background:var(--paper);user-select:none}
#cv.m-link,#cv.m-edge{cursor:crosshair}
#cv.m-place{cursor:copy}
.gmin{fill:none;stroke:var(--grid);stroke-width:1}
.gmaj{fill:none;stroke:var(--grid2);stroke-width:1}
.tabs{position:absolute;top:12px;left:12px;z-index:2;background:var(--side)}

/* nodes */
.node .halo{fill:none;stroke:none}
.node.sel .halo{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1;stroke-dasharray:3 3}
.node text{pointer-events:none}
.body{fill:var(--card)}
.headf{fill:var(--head)}
.frame{fill:none;stroke:var(--ink);stroke-width:1.5}
.sep{fill:none;stroke:var(--ink);stroke-width:1.1}
.uc{fill:var(--card);stroke:var(--ink);stroke-width:1.5}
.fig{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.sysf{fill:none;stroke:var(--ink);stroke-width:1.4}
.ring{fill:none;stroke:var(--ink);stroke-width:1.5}
.dot{fill:var(--ink)}
.crowc{fill:var(--paper)}
.tbb .crowc{fill:var(--btn)}
.tbb .dot{fill:currentColor}
.node.sel .ring{stroke:var(--accent)}
.node.sel .dot{fill:var(--accent)}
.node.sel .frame,.node.sel .sep,.node.sel .uc,.node.sel .fig,.node.sel .sysf{stroke:var(--accent)}
.nm{font:600 13.5px "Archivo",system-ui,sans-serif;fill:var(--ink);text-anchor:middle}
.nm.ab{font-style:italic}
.st{font:400 12px "Archivo",system-ui,sans-serif;fill:var(--muted);text-anchor:middle}
.mb{font:400 12px "JetBrains Mono",ui-monospace,monospace;fill:var(--ink)}
.mb.us{text-decoration:underline}
.mb.ab{font-style:italic}
.uct{font:500 13px "Archivo",system-ui,sans-serif;fill:var(--ink);text-anchor:middle}
.sn{font:600 13px "Archivo",system-ui,sans-serif;fill:var(--ink)}
.node.sel .sn{fill:var(--accent)}
.ghost{opacity:.5;pointer-events:none}

/* relations */
.rln{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round}
.rel.dash .rln{stroke-dasharray:7 5}
.rhit{fill:none;stroke:transparent;stroke-width:12;cursor:pointer}
.hd{stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.hd.open{fill:none}
.hd.tri,.hd.dia{fill:var(--paper)}
.hd.diaF{fill:var(--ink)}
.rel.sel .rln,.rel.sel .hd{stroke:var(--accent)}
.rel.sel .rln{stroke-width:2.2}
.rel.sel .hd.diaF{fill:var(--accent)}
.rel.draft .rln,.rel.draft .hd{stroke:var(--accent)}
.rel.draft .hd.diaF{fill:var(--accent)}
.ml,.rn{fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:4;stroke-linejoin:round;pointer-events:none}
.ml{font:500 11.5px "JetBrains Mono",ui-monospace,monospace}
.rn{font:italic 500 12px "Archivo",system-ui,sans-serif}
.rel.sel .ml,.rel.sel .rn{fill:var(--accent)}

#over *{pointer-events:none}
#over .via{pointer-events:all;fill:var(--paper);stroke:var(--accent);stroke-width:1.6;cursor:move}
#over .via[data-resize]{cursor:nwse-resize}
.dvia{fill:var(--accent)}
.hov{fill:none;stroke:var(--accent);stroke-width:2}
.box{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1;stroke-dasharray:4 3}
.xh{stroke:var(--accent);stroke-width:1.2}
.draft{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

.status{position:absolute;left:12px;right:12px;bottom:10px;display:flex;gap:14px;align-items:center;
  pointer-events:none;font-size:12.5px;color:var(--muted)}
.status .md{color:var(--ink);font-weight:600;background:var(--side);border:1px solid var(--rule);border-radius:5px;padding:2px 8px}
.status .hint{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status .pos{font:500 11.5px "JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

.insp{position:absolute;top:12px;right:12px;width:272px;max-height:calc(100% - 56px);overflow-y:auto;
  background:var(--side);border:1px solid var(--rule);border-radius:8px;padding:12px}
.insp>div{display:flex;flex-direction:column;gap:8px}
.insp .f{display:grid;grid-template-columns:78px 1fr;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.insp .f span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.insp .blk{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.insp .chk{display:flex;align-items:center;gap:8px;font-size:12.5px}
.insp input:not([type]),.insp textarea{width:100%;border:1px solid var(--rule);border-radius:5px;
  background:var(--paper);color:var(--ink);padding:5px 7px;font:500 12.5px "JetBrains Mono",ui-monospace,monospace}
.insp textarea{resize:vertical;line-height:1.5;white-space:pre;overflow-x:auto}
.insp input[type=checkbox]{accent-color:var(--accent);margin:0}
.tip{margin:0;color:var(--muted);font-size:11.5px}
.tip code{font:500 11px "JetBrains Mono",ui-monospace,monospace;color:var(--ink)}

.codeview{position:absolute;inset:60px 12px 44px 12px;display:flex;flex-direction:column;gap:8px}
.codeview textarea{flex:1;border:1px solid var(--rule);border-radius:8px;background:var(--card);color:var(--ink);
  padding:14px 16px;font:400 13px/1.6 "JetBrains Mono",ui-monospace,monospace;resize:none;tab-size:2}
.codeview textarea.bad{border-color:var(--bad)}
.cerr{min-height:20px;font-size:12.5px;color:var(--muted)}
.cerr.bad{color:var(--bad)}

@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  aside{flex-direction:row;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;gap:18px;padding:10px 16px;
    border-right:0;border-bottom:1px solid var(--rule);max-height:42vh}
  aside>section,aside>header{flex:none;width:220px}
  .help{display:none}
  .status .hint{display:none}
  .insp{width:auto;left:12px;top:60px;max-height:48%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <header class="brand">
      <h1>UML</h1>
      <p>Grille de 20 px</p>
    </header>

    <section>
      <h2>Diagramme</h2>
      <div class="seg vert" id="dtype">
        <button data-type="class">Classes</button>
        <button data-type="usecase">Cas d'utilisation</button>
        <button data-type="state">Machine d'états</button>
        <button data-type="er">Entité-association</button>
        <button data-type="flow">Organigramme</button>
        <button data-type="automaton">Automate fini</button>
        <button data-type="graph">Graphe</button>
        <button data-type="free">Dessin libre</button>
      </div>
    </section>

    <section>
      <h2>Outils</h2>
      <div class="tb" id="tb"></div>
    </section>

    <section>
      <h2>Édition</h2>
      <div class="tb tb4" id="ed">
        <button class="tbb" data-act="undo" title="Annuler (Ctrl Z)" aria-label="Annuler"><svg viewBox="0 0 20 20"><path class="ico" d="M7 4L3 8l4 4M3 8h9a4.5 4.5 0 0 1 0 9H9"/></svg></button>
        <button class="tbb" data-act="redo" title="Rétablir (Ctrl Y)" aria-label="Rétablir"><svg viewBox="0 0 20 20"><path class="ico" d="M13 4l4 4-4 4M17 8H8a4.5 4.5 0 0 0 0 9h3"/></svg></button>
        <button class="tbb" data-act="dup" title="Dupliquer (Ctrl D)" aria-label="Dupliquer"><svg viewBox="0 0 20 20"><rect class="ico" x="3" y="3" width="10" height="10" rx="1.5"/><path class="ico" d="M7 16.5h8.5a1.5 1.5 0 0 0 1.5-1.5V7"/></svg></button>
        <button class="tbb" data-act="del" title="Supprimer (Suppr)" aria-label="Supprimer"><svg viewBox="0 0 20 20"><path class="ico" d="M3.5 5.5h13M8 5.5V3.5h4v2M5.5 5.5l.8 11h7.4l.8-11M8.5 8.5v5.5M11.5 8.5v5.5"/></svg></button>
      </div>
    </section>

    <section>
      <div class="acts">
        <button class="act" data-act="clear">Nouveau diagramme</button>
        <button class="act" data-act="demo">Recharger l'exemple</button>
      </div>
    </section>

    <div class="help">
      <div><span>Élément</span><span>double clic</span></div>
      <div><span>Relier</span><span>glisser un bord</span></div>
      <div><span>Coude</span><span>double clic</span></div>
      <div><span>Zoom</span><span>molette</span></div>
      <div><span>Vue</span><span>clic droit glissé</span></div>
      <div><span>Multiple</span><span>Maj + clic</span></div>
    </div>
  </aside>

  <main>
    <svg id="cv" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="gmin" width="20" height="20" patternUnits="userSpaceOnUse">
          <path class="gmin" d="M20 0H0V20"/>
        </pattern>
        <pattern id="gmaj" width="100" height="100" patternUnits="userSpaceOnUse">
          <rect width="100" height="100" fill="url(#gmin)"/>
          <path class="gmaj" d="M100 0H0V100"/>
        </pattern>
      </defs>
      <g id="world">
        <rect x="-20000" y="-20000" width="40000" height="40000" fill="url(#gmaj)"/>
        <g id="nodes"></g>
        <g id="rels"></g>
        <g id="over"></g>
      </g>
    </svg>

    <div class="seg tabs" id="tabs">
      <button data-view="draw">Diagramme</button>
      <button data-view="code" id="codeTab">PlantUML</button>
    </div>

    <div id="insp" class="insp" hidden>
      <div id="inspC">
        <label class="f"><span>Nom</span><input id="cName" spellcheck="false" autocomplete="off"></label>
        <label class="f" id="cStereoRow"><span>Stéréotype</span><input id="cStereo" list="stereos" placeholder="aucun" spellcheck="false" autocomplete="off"></label>
        <label class="chk" id="cAbsRow"><input type="checkbox" id="cAbs">Abstrait</label>
        <label class="blk"><span id="cBodyL">Contenu</span><textarea id="cBody" rows="8" spellcheck="false" placeholder="- nom : String&#10;---&#10;+ aire() : double"></textarea></label>
        <p class="tip" id="cTipE"><code>PK</code> souligne l'identifiant.</p>
        <p class="tip" id="cTip"><code>---</code> trace un séparateur. <code>{static}</code> souligne, <code>{abstract}</code> met en italique.</p>
      </div>
      <div id="inspN">
        <label class="f"><span>Nom</span><input id="nName" spellcheck="false" autocomplete="off"></label>
        <label class="chk" id="nInitRow"><input type="checkbox" id="nInit">Initial</label>
        <label class="chk" id="nAccRow"><input type="checkbox" id="nAcc">Acceptant</label>
      </div>
      <div id="inspR">
        <div class="types" id="rTypes"></div>
        <div class="f" id="rCardA"><span id="rCardAL">A</span><div class="types" data-end="ma"></div></div>
        <div class="f" id="rCardB"><span id="rCardBL">B</span><div class="types" data-end="mb"></div></div>
        <label class="f" id="rNameRow"><span id="rNameL">Nom</span><input id="rName" placeholder="optionnel" spellcheck="false" autocomplete="off"></label>
        <label class="f" id="rMaRow"><span id="rMaL">Source</span><input id="rMa" list="mults" placeholder="multiplicité" spellcheck="false" autocomplete="off"></label>
        <label class="f" id="rMbRow"><span id="rMbL">Cible</span><input id="rMb" list="mults" placeholder="multiplicité" spellcheck="false" autocomplete="off"></label>
        <button class="act" id="rSwap">Inverser le sens</button>
      </div>
    </div>
    <datalist id="stereos"><option value="interface"><option value="enumeration"><option value="entity"><option value="service"><option value="utility"><option value="dataType"></datalist>
    <datalist id="mults"><option value="1"><option value="0..1"><option value="*"><option value="0..*"><option value="1..*"></datalist>

    <div id="codeview" class="codeview" hidden>
      <textarea id="code" spellcheck="false" autocomplete="off" aria-label="Code PlantUML"></textarea>
      <div id="cerr" class="cerr"></div>
    </div>

    <div class="status" id="status">
      <span class="md" id="stMode"></span>
      <span class="hint" id="stHint"></span>
      <span class="pos" id="stPos"></span>
    </div>
  </main>
</div>

<script>
(() => {
'use strict';
/* The grid, the router, the selection, the history and the viewport come
   from mockups/circuit.html. What changes: a node is a box whose size
   follows its content, and a relation attaches to a SIDE, not to a pin. The
   anchor points are recomputed on every render: each end takes the side
   facing the other end, and the ends sharing a side are spread along it in
   the order of what they point to, so they do not cross.

   Two diagram types share all of it. They differ only by their node kinds
   and their relation set (DIAGRAMS). A diagram also has a text form, edited
   in the second tab and parsed back: a subset of PlantUML for classes and
   use cases, Mermaid for the flowchart, the state machine and the ER
   diagram, Graphviz DOT for the automaton and the graph. Positions survive
   by name; new elements are placed below, or after, what leads to them.

   The automaton and the graph do not route: their lines are straight
   between circles, bend apart when two join the same pair, and loop over a
   node that points to itself (computeStraight). */
const G = 20, TURN = 4, HEAD = 40, ROW = 20, PAD = 10, MINW = 120;
const $ = s => document.querySelector(s);
const svg = $('#cv'), world = $('#world'), Ln = $('#nodes'), Lr = $('#rels'), Lo = $('#over');
const DIRS = [[1,0],[0,1],[-1,0],[0,-1]];
const snap = v => Math.round(v/G)*G;
const esc = s => String(s).replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));

/* Relation notations. The names are for the code only: the toolbox shows
   the notation and nothing else. */
const REL = {
  assoc:{head:null,   dash:false},
  nav:  {head:'open', dash:false},
  inh:  {head:'tri',  dash:false},
  impl: {head:'tri',  dash:true},
  dep:  {head:'open', dash:true},
  agg:  {head:'dia',  dash:false},
  comp: {head:'diaF', dash:false},
  incl: {head:'open', dash:true, label:'«include»'},
  ext:  {head:'open', dash:true, label:'«extend»'},
  flow: {head:'arrowF', dash:false, labelAtStart:true},
  strans:{head:'open', dash:false},
  erel: {head:null, dash:false, crow:true},
  trans:{head:'arrowF', dash:false, labelCls:'ml'},
  edge: {head:null, dash:false, labelCls:'ml'},
  arc:  {head:'arrowF', dash:false, labelCls:'ml'}
};
const DIAGRAMS = {
  class:    {nodes:['class'], rels:['assoc','nav','inh','impl','dep','agg','comp'], dbl:'class', lang:'PlantUML'},
  usecase:  {nodes:['actor','usecase','system'], rels:['assoc','incl','ext','inh'], dbl:'usecase', lang:'PlantUML'},
  state:    {nodes:['initial','state','final'], rels:['strans'], dbl:'state', lang:'Mermaid', place:'down', relName:'Étiquette'},
  er:       {nodes:['entity'], rels:['erel'], dbl:'entity', lang:'Mermaid', relName:'Verbe'},
  flow:     {nodes:['terminal','action','decision'], rels:['flow'], dbl:'action', lang:'Mermaid', place:'down', relName:'Étiquette'},
  automaton:{nodes:['astate','accept'], rels:['trans'], dbl:'astate', lang:'DOT', straight:true, place:'right', relName:'Symboles'},
  graph:    {nodes:['vertex'], rels:['edge','arc'], dbl:'vertex', lang:'DOT', straight:true, place:'down', relName:'Poids'},
  /* free: shapes, a line and a brush; no link, no text form */
  free:     {nodes:['stroke','line','rect','square','circle','ellipse','triangle'], rels:[], dbl:null, lang:null}
};
const SHAPES = new Set(['rect','square','circle','ellipse','triangle']), INK = new Set(['stroke','line']);
const RESIZABLE = new Set(['system', ...SHAPES]);
const SHAPE_SIZE = {rect:[100,60], square:[60,60], circle:[60,60], ellipse:[100,60], triangle:[80,60]};
/* A tool may place a node kind with a preset: the accepting state is a state */
const TOOLKIND = {accept:{t:'astate', accept:true}};
const PREFIX = {class:'Classe', actor:'Acteur', usecase:'Cas', system:'Système', terminal:'Début', action:'Action',
  decision:'Condition', state:'État', entity:'Entité'};
const CARDS = ['1', '0..1', '1..*', '0..*'];
const CIRCLE = new Set(['astate','vertex']);
const FLOWN = new Set(['terminal','action','decision']);
const headOf = r => REL[r.type].head;
const isSep = l => /^\s*-{3,}\s*$/.test(l);

/* Text measurement: a box follows its longest line */
const mctx = document.createElement('canvas').getContext('2d');

/* A name wrapped to a width: use cases, actions, decisions */

    const t = cur ? cur+' '+w : w;

  if (CIRCLE.has(n.t)){ const d = Math.max(40, up(tw('uc', n.name)+18, G)); return {w:d, h:d}; }

/* The node under a point, and whether the point is on its border band.
   A system is reached only by its title strip or its frame, so what it
   contains stays clickable. */
function nodeAt(x, y, withSystems=true){
  const band = Math.max(4, 6/view.k);
  const R = n => rects.get(n.id) || rectOf(n);
  for (let i = S.nodes.length-1; i >= 0; i--){
    const n = S.nodes[i]; if (n.t==='system') continue;
    if (INK.has(n.t)){ if (nearInk(n, x, y, band+2)) return {id:n.id, edge:false}; continue; }
    const r = R(n);
    if (x < r.x0-band || x > r.x1+band || y < r.y0-band || y > r.y1+band) continue;
    const inner = x > r.x0+band && x < r.x1-band && y > r.y0+band && y < r.y1-band;
    return {id:n.id, edge:!inner};
  }
  if (withSystems) for (let i = S.nodes.length-1; i >= 0; i--){
    const n = S.nodes[i]; if (n.t!=='system') continue;
    const r = R(n);
    const out = x < r.x0-band || x > r.x1+band || y < r.y0-band || y > r.y1+band;
    const inner = x > r.x0+band && x < r.x1-band && y > r.y0+band && y < r.y1-band;
    const title = x >= r.x0 && x <= r.x1 && y >= r.y0 && y <= r.y0+28;
    if (!out && (!inner || title)) return {id:n.id, edge:false, sys:true};
  }
  return null;
}

/* Whether a point is within `d` of a stroke or a line */

/* A brush stroke, smoothed through the midpoints */

    if (na && ONTO[na.t]){ pts[0] = ONTO[na.t](pts[0], rs.get(na.id), A.d); A = {...A, x:pts[0][0], y:pts[0][1]}; }
    if (nb && ONTO[nb.t]){ const k = pts.length-1; pts[k] = ONTO[nb.t](pts[k], rs.get(nb.id), B.d); B = {...B, x:pts[k][0], y:pts[k][1]}; }

}
const pathD = p => 'M'+p.map(q => q[0]+' '+q[1]).join('L');

/* Drawing */
function nodeSVG(n, o={}){
  const {w,h} = sizeOf(n), cx = w/2;
  let s = `<g class="node${o.sel?' sel':''}${o.ghost?' ghost':''}"${o.ghost?'':` data-node="${n.id}"`} transform="translate(${n.x} ${n.y})">`;
  s += `<rect class="halo" x="-4" y="-4" width="${w+8}" height="${h+8}" rx="3"/>`;
  if (INK.has(n.t)){
    s += `<path class="fig" d="${n.t==='stroke' ? inkPath(n.pts) : 'M'+n.pts.map(q => q.join(' ')).join('L')}"/>`;
  } else if (SHAPES.has(n.t)){
    s += n.t==='circle' || n.t==='ellipse' ? `<ellipse class="uc" cx="${cx}" cy="${h/2}" rx="${cx}" ry="${h/2}"/>`
       : n.t==='triangle' ? `<path class="uc" d="M${cx} 0L${w} ${h}L0 ${h}Z"/>`
       : `<rect class="uc" width="${w}" height="${h}"/>`;
    if (n.name) s += `<text class="uct" x="${cx}" y="${(n.t==='triangle' ? h*0.66 : h/2)+4.5}">${esc(n.name)}</text>`;
  } else if (n.t==='initial'){
    s += `<circle class="dot" cx="20" cy="20" r="9"/>`;
  } else if (n.t==='final'){
    s += `<circle class="ring" cx="20" cy="20" r="11"/><circle class="dot" cx="20" cy="20" r="6.5"/>`;
  } else if (CIRCLE.has(n.t)){
    s += `<circle class="uc" cx="${cx}" cy="${h/2}" r="${cx}"/>`;
    if (n.accept) s += `<circle class="ring" cx="${cx}" cy="${h/2}" r="${cx-4}"/>`;
    if (n.initial) s += `<path class="fig" d="M-30 ${h/2}H-2"/>` + headSVG('arrowF', [[-30, h/2], [0, h/2]]);
    s += `<text class="uct" x="${cx}" y="${h/2+4.5}">${esc(n.name)}</text>`;
  } else if (n.t==='state'){
    s += `<rect class="uc" width="${w}" height="${h}" rx="10"/><text class="uct" x="${cx}" y="25">${esc(n.name)}</text>`;
    if (n.body.length) s += `<path class="sep" d="M0 40H${w}"/>` +
      n.body.map((l,i) => `<text class="mb" x="10" y="${40+PAD/2+i*ROW+14}">${esc(l)}</text>`).join('');
  } else if (n.t==='actor'){
    s += `<path class="fig" d="M20 17V38M8 24H32M20 38L10 54M20 38L30 54"/><circle class="fig" cx="20" cy="10" r="7"/>`;
    s += `<text class="uct" x="${cx}" y="72">${esc(n.name)}</text>`;
  } else if (n.t==='usecase'){
    const ls = wrapName(n.name), y0 = h/2 - (ls.length-1)*8 + 4.5;
    s += `<ellipse class="uc" cx="${cx}" cy="${h/2}" rx="${cx}" ry="${h/2}"/>`;
    ls.forEach((l,i) => s += `<text class="uct" x="${cx}" y="${y0+i*16}">${esc(l)}</text>`);
  } else if (FLOWN.has(n.t)){
    const ls = wrapName(n.name, n.t==='decision' ? 120 : 200), y0 = h/2 - (ls.length-1)*8 + 4.5;
    s += n.t==='decision' ? `<path class="uc" d="M${cx} 0L${w} ${h/2}L${cx} ${h}L0 ${h/2}Z"/>`
                          : `<rect class="uc" width="${w}" height="${h}" rx="${n.t==='terminal' ? h/2 : 3}"/>`;
    ls.forEach((l,i) => s += `<text class="uct" x="${cx}" y="${y0+i*16}">${esc(l)}</text>`);
  } else if (n.t==='system'){
    s += `<rect class="sysf" width="${w}" height="${h}"/><text class="sn" x="12" y="20">${esc(n.name)}</text>`;
  } else {
    s += `<rect class="body" width="${w}" height="${h}"/><rect class="headf" width="${w}" height="${HEAD}"/>`;
    let y = HEAD, seps = '', text = '';
    for (const k of compartments(n)){
      seps += `M0 ${y}H${w}`;
      k.forEach((raw, i) => {
        const m = member(raw);
        const und = m.st || (n.t==='entity' && /\bPK\b/.test(raw));
        text += `<text class="mb${und?' us':''}${m.ab?' ab':''}" x="10" y="${y + PAD/2 + i*ROW + 14}">${esc(m.text)}</text>`;
      });
      y += k.length*ROW + PAD;
    }
    if (seps) s += `<path class="sep" d="${seps}"/>`;
    s += `<rect class="frame" width="${w}" height="${h}"/>`;
    const nm = `<text class="nm${n.abstract?' ab':''}" x="${cx}" y="${n.stereo?33:25}">${esc(n.name)}</text>`;
    s += (n.stereo ? `<text class="st" x="${cx}" y="16">«${esc(n.stereo)}»</text>${nm}` : nm) + text;
  }
  return s + '</g>';
}
function headSVG(kind, pts){
  const B = pts[pts.length-1]; let P = null;
  for (let i = pts.length-2; i >= 0; i--) if (pts[i][0]!==B[0] || pts[i][1]!==B[1]){ P = pts[i]; break; }
  if (!P) return '';
  const L = Math.hypot(B[0]-P[0], B[1]-P[1]), ux = (B[0]-P[0])/L, uy = (B[1]-P[1])/L;
  const at = (a,b) => `${B[0]-ux*a-uy*b} ${B[1]-uy*a+ux*b}`;
  if (kind==='open') return `<path class="hd open" d="M${at(12,6)}L${at(0,0)}L${at(12,-6)}"/>`;
  if (kind==='arrowF') return `<path class="hd diaF" d="M${at(0,0)}L${at(11,5)}L${at(11,-5)}Z"/>`;
  if (kind==='tri') return `<path class="hd tri" d="M${at(0,0)}L${at(15,8)}L${at(15,-8)}Z"/>`;
  return `<path class="hd ${kind}" d="M${at(0,0)}L${at(10,6)}L${at(20,0)}L${at(10,-6)}Z"/>`;
}
/* Crow's foot at an entity end, E.d pointing away from the entity */
function crowSVG(card, E){
  if (!card || E.d < 0) return '';
  const u = DIRS[E.d], P = (a, b) => `${E.x+u[0]*a-u[1]*b} ${E.y+u[1]*a+u[0]*b}`;
  const bar = t => `M${P(t,-6)}L${P(t,6)}`, many = `M${P(12,0)}L${P(0,-7)}M${P(12,0)}L${P(0,7)}`;
  const ring = t => `<circle class="hd crowc" cx="${E.x+u[0]*t}" cy="${E.y+u[1]*t}" r="4"/>`;
  const [d, r] = card==='1' ? [bar(7)+bar(13), ''] : card==='0..1' ? [bar(7), ring(18)]
               : card==='1..*' ? [many+bar(16), ''] : [many, ring(18)];
  return `<path class="hd open" d="${d}"/>` + r;
}
function multSVG(t, E, cls='ml'){
  if (!t) return '';
  const [x, y, a] = E.d===0 ? [E.x+5, E.y-11, 'start'] : E.d===2 ? [E.x-5, E.y-11, 'end']
                  : E.d===1 ? [E.x+11, E.y+15, 'start'] : [E.x+11, E.y-6, 'start'];
  return `<text class="${cls}" x="${x}" y="${y}" text-anchor="${a}">${esc(t)}</text>`;
}
function nameSVG(t, pts, cls='rn'){
  if (!t) return '';
  let best = 0, bi = 0;
  for (let i = 0; i < pts.length-1; i++){
    const l = Math.abs(pts[i+1][0]-pts[i][0]) + Math.abs(pts[i+1][1]-pts[i][1]);
    if (l > best){ best = l; bi = i; }
  }
  const a = pts[bi], b = pts[bi+1] || a, mx = (a[0]+b[0])/2, my = (a[1]+b[1])/2;
  return a[1]===b[1] ? `<text class="${cls}" x="${mx}" y="${my-7}" text-anchor="middle">${esc(t)}</text>`
                     : `<text class="${cls}" x="${mx+8}" y="${my+4}">${esc(t)}</text>`;
}
function relSVG(r, lay, o={}){
  const d = lay.d || pathD(lay.pts), head = headOf(r), T = REL[r.type];
  let s = `<g class="rel${o.sel?' sel':''}${o.draft?' draft':''}${REL[r.type].dash?' dash':''}"${o.draft||o.icon?'':` data-rel="${r.id}"`}>`;
  if (!o.draft && !o.icon) s += `<path class="rhit" d="${d}"/>`;
  s += `<path class="rln" d="${d}"/>`;
  if (head) s += headSVG(head, lay.hp || lay.pts);
  if (T.crow) s += crowSVG(r.ma, lay.A) + (typeof r.b === 'string' ? crowSVG(r.mb, lay.B) : '');
  if (!o.icon){
    const t = T.label || r.name, cls = T.labelCls || 'rn';
    if (!T.crow) s += multSVG(r.ma, lay.A) + (typeof r.b === 'string' ? multSVG(r.mb, lay.B) : '');
    /* a flow's label (oui, non) sits where it leaves its decision */
    if (t) s += lay.lab ? `<text class="${cls}" x="${lay.lab.x}" y="${lay.lab.y+4}" text-anchor="middle">${esc(t)}</text>`
              : T.labelAtStart ? multSVG(t, lay.A, cls) : nameSVG(t, lay.pts, cls);
  }
  return s + '</g>';
}

let rq = 0;

const ident = s => /^[\p{L}_][\p{L}\w]*$/u.test(s);

function plantuml(){
  const byId = new Map(S.nodes.map(n => [n.id, n]));
  let o = '@startuml\n';
  if (type==='class'){
    for (const n of S.nodes){
      const kw = n.stereo==='interface' ? 'interface' : n.stereo==='enumeration' ? 'enum' : n.abstract ? 'abstract class' : 'class';
      const st = n.stereo && n.stereo!=='interface' && n.stereo!=='enumeration' ? ` <<${n.stereo}>>` : '';
      o += `${kw} ${q(n.name)}${st} {\n` + n.body.map(m => '  '+(isSep(m) ? '--' : m)+'\n').join('') + '}\n';
    }
    if (S.rels.length) o += '\n';
    for (const r of S.rels){
      const a = byId.get(r.a), b = byId.get(r.b); if (!a || !b) continue;
      o += `${q(a.name)}${r.ma?` "${r.ma}"`:''} ${PUML[r.type]}${r.mb?` "${r.mb}"`:''} ${q(b.name)}${r.name?` : ${r.name}`:''}\n`;
    }
    return o + '@enduml\n';
  }
  /* use cases: an alias per element whose name is not an identifier */
  const alias = new Map(); let na = 0, nu = 0;
  for (const n of S.nodes) if (n.t!=='system') alias.set(n.id, ident(n.name) ? n.name : n.t==='actor' ? 'A'+(++na) : 'UC'+(++nu));
  const decl = n => `${n.t==='actor' ? 'actor' : 'usecase'} ${q(n.name)}${alias.get(n.id)!==n.name ? ' as '+alias.get(n.id) : ''}\n`;
  o += 'left to right direction\n';
  const inside = new Set();
  const systems = S.nodes.filter(n => n.t==='system').map(s => {
    const R = rectOf(s), members = S.nodes.filter(n => n.t!=='system' && !inside.has(n.id) && holds(R, rectOf(n)));
    members.forEach(n => inside.add(n.id));
    return {s, members};
  });
  for (const n of S.nodes) if (n.t!=='system' && !inside.has(n.id)) o += decl(n);
  for (const {s, members} of systems) o += `rectangle ${q(s.name)} {\n` + members.map(n => '  '+decl(n)).join('') + '}\n';
  if (S.rels.length) o += '\n';
  for (const r of S.rels){
    if (!alias.has(r.a) || !alias.has(r.b)) continue;
    const lab = r.type==='incl' ? ' : <<include>>' : r.type==='ext' ? ' : <<extend>>' : r.name ? ' : '+r.name : '';
    o += `${alias.get(r.a)} ${PUML[r.type]} ${alias.get(r.b)}${lab}\n`;
  }
  return o + '@enduml\n';
}

const NAMEP = String.raw`"[^"]+"|\([^)]+\)|:[^:]+:|[\p{L}\w$]+`;

  '--o':['agg',0], 'o--':['agg',1], '--*':['comp',0], '*--':['comp',1]};

const unq = s => s.replace(/^"(.*)"$/, '$1').trim();
function parse(text){
  const P = {nodes:[], rels:[], errors:[]}, keys = new Map(), systems = [];
  let cur = null;

    let n = keys.get(name) || (alias && keys.get(alias));
    if (!n || n.t!==t){
      n = {t, name, stereo:'', abstract:false, body:t==='class' ? ['---'] : [], sys:null};
      P.nodes.push(n);
    }
    keys.set(name, n); if (alias) keys.set(alias, n);

    if (tok[0]==='(') return declare('usecase', tok.slice(1,-1).trim());
    if (tok[0]===':' && tok.length>1) return declare('actor', tok.slice(1,-1).trim());
    const n = keys.get(unq(tok));

    return type==='class' ? declare('class', unq(tok)) : null;
  };

    const s = raw.trim(), ln = i+1;
    if (cur){

      if (s) cur.body.push(/^(-{2,}|={2,}|\.{2,}|_{2,})$/.test(s) ? '---' : s);
      return;
    }
    if (!s || s[0]==="'" || IGNORED.test(s)) return;
    if (s==='}'){ systems.length ? systems.pop() : err(ln, 'accolade fermante en trop'); return; }
    let m;
    if (type==='class' && (m = CLASSRE.exec(s))){
      const kw = m[1].replace(/\s+/g,' ');
      const n = declare('class', unq(m[2]));
      n.abstract = kw.startsWith('abstract');
      n.stereo = kw==='interface' ? 'interface' : kw==='enum' ? 'enumeration' : (m[3] || '');
      if (m[4]){ n.body = []; if (!m[5]) cur = n; }

    }
    if (type==='usecase'){
      if ((m = new RegExp(`^actor\\s+(${NAMEP})(?:\\s+as\\s+([\\p{L}\\w$]+))?(?:\\s*<<[^>]*>>)?$`, 'u').exec(s))){ declare('actor', unq(m[1]).replace(/^:(.*):$/, '$1'), m[2]); return; }
      if ((m = /^:([^:]+):(?:\s+as\s+([\p{L}\w$]+))?$/u.exec(s))){ declare('actor', m[1].trim(), m[2]); return; }
      if ((m = new RegExp(`^usecase\\s+(${NAMEP})(?:\\s+as\\s+([\\p{L}\\w$]+))?$`, 'u').exec(s))){ declare('usecase', unq(m[1]).replace(/^\((.*)\)$/, '$1'), m[2]); return; }
      if ((m = /^\(([^)]+)\)(?:\s+as\s+([\p{L}\w$]+))?$/u.exec(s))){ declare('usecase', m[1].trim(), m[2]); return; }
      if ((m = new RegExp(`^(?:rectangle|package)\\s+(${NAMEP})(?:\\s+as\\s+[\\p{L}\\w$]+)?\\s*\\{$`, 'u').exec(s))){
        const sy = {t:'system', name:unq(m[1]), sys:null}; P.nodes.push(sy); systems.push(sy); return;
      }
    }
    if ((m = RELRE.exec(s))){
      const norm = m[3].replace(/(up|down|left|right|u|d|l|r)/, '').replace(/-+/g, '--').replace(/\.+/g, '..');
      const map = ARROWS[norm];
      if (!map){ err(ln, `flèche inconnue « ${m[3]} »`); return; }

      if (!a || !b){ err(ln, `« ${unq(!a ? m[1] : m[5])} » n'est pas déclaré`); return; }
      if (rev){ [a, b] = [b, a]; [ma, mb] = [mb, ma]; }
      if (type==='usecase'){
        if (t==='dep'){
          if (/include/i.test(label)) t = 'incl'; else if (/extend/i.test(label)) t = 'ext';
          else { err(ln, 'une flèche pointillée attend : <<include>> ou : <<extend>>'); return; }
          label = '';
        } else if (t==='nav') t = 'assoc';
        else if (t!=='assoc' && t!=='inh'){ err(ln, `flèche « ${m[3]} » hors du diagramme de cas`); return; }
      }
      P.rels.push({a, b, type:t, ma, mb, name:label});
      return;
    }
    err(ln, `je ne comprends pas « ${s} »`);
  });
  if (cur) err(text.split('\n').length, `la classe « ${cur.name} » n'est pas fermée`);
  if (systems.length) err(text.split('\n').length, `le système « ${systems[systems.length-1].name} » n'est pas fermé`);
  return P;
}
/* A parsed diagram replaces the current one; a node keeps its place when
   its kind and name match, a relation its elbows when its ends and type do. */
function applyParsed(P){
  const old = new Map(S.nodes.map(n => [n.t+'|'+n.name, n])), map = new Map(), fresh = [];
  S.nodes = P.nodes.map(p => {
    const o = old.get(p.t+'|'+p.name);
    const n = o ? {...o} : {id:'k'+S.seq++, t:p.t, name:p.name, x:0, y:0, w:280, h:240, stereo:'', abstract:false, body:[], accept:false, initial:false};
    if (o) old.delete(p.t+'|'+p.name); else fresh.push(p);
    for (const f of ['stereo','abstract','body','accept','initial']) if (p[f]!==undefined) n[f] = p[f];
    map.set(p, n); return n;
  });
  const oldRel = new Map(S.rels.map(r => [r.a+'|'+r.b+'|'+r.type, r]));
  S.rels = P.rels.map(p => {
    const a = map.get(p.a).id, b = map.get(p.b).id, k = a+'|'+b+'|'+p.type, o = oldRel.get(k);
    oldRel.delete(k);
    return {id:o ? o.id : 'r'+S.seq++, type:p.type, a, b, via:o ? o.via : [], name:p.name, ma:p.ma, mb:p.mb};
  });
  placeFresh(fresh, map);

}
function placeFresh(fresh, map){
  if (!fresh.length) return;
  const freshN = new Set(fresh.map(p => map.get(p)));
  if (DIAGRAMS[type].place) return placeFlow(fresh.map(p => map.get(p)), freshN, DIAGRAMS[type].place==='right');
  const placed = S.nodes.filter(n => !freshN.has(n)).map(rectOf);
  const x0 = placed.length ? Math.min(...placed.map(r => r.x0)) : 40;
  let x = x0, y = placed.length ? Math.max(...placed.map(r => r.y1)) + 60 : 40, rowH = 0;
  const inSys = new Map();
  for (const p of fresh){
    const n = map.get(p);
    if (p.sys){ const s = map.get(p.sys); if (!inSys.has(s)) inSys.set(s, []); inSys.get(s).push(n); continue; }
    const {w,h} = sizeOf(n);
    n.x = x; n.y = y; x += w+40; rowH = Math.max(rowH, h);
    if (x > x0+880){ x = x0; y += rowH+60; rowH = 0; }
  }
  /* new members of a system stack below its current content, and it grows */
  for (const [s, ns] of inSys){
    const R = rectOf(s);
    const members = S.nodes.filter(n => n.t!=='system' && !freshN.has(n) && holds(R, rectOf(n)));
    /* 40 apart, never 20: two boxes one cell apart leave no free row for a line to leave by */
    let yy = members.length ? Math.max(...members.map(n => rectOf(n).y1)) + 40 : s.y+40, maxX = R.x1, maxY = R.y1;
    for (const n of ns){
      const {w,h} = sizeOf(n);
      n.x = s.x+40; n.y = yy; yy += h+40;
      maxX = Math.max(maxX, n.x+w+40); maxY = Math.max(maxY, n.y+h+40);
    }
    s.w = Math.ceil((maxX-s.x)/G)*G; s.h = Math.ceil((maxY-s.y)/G)*G;
  }
}

/* Mermaid, out and in: the flowchart is a graph, and Mermaid says graphs */
const SHAPE = {terminal:['([', '])'], action:['[', ']'], decision:['{', '}']};
function mermaid(){
  const id = new Map(S.nodes.filter(n => FLOWN.has(n.t)).map((n,i) => [n.id, 'n'+(i+1)]));
  let o = 'flowchart TD\n';
  for (const n of S.nodes) if (id.has(n.id)){
    const [a, b] = SHAPE[n.t];
    o += `  ${id.get(n.id)}${a}"${n.name.replace(/"/g, '#quot;')}"${b}\n`;
  }
  for (const r of S.rels) if (id.has(r.a) && id.has(r.b))
    o += `  ${id.get(r.a)} -->${r.name ? `|${r.name.replace(/\|/g, '/')}|` : ''} ${id.get(r.b)}\n`;

}
function parseMermaid(text){
  const P = {nodes:[], rels:[], errors:[]}, ids = new Map();
  const SHAPES = [[/^\(\[(.*)\]\)$/s, 'terminal'], [/^\(\((.*)\)\)$/s, 'terminal'], [/^\{(.*)\}$/s, 'decision'],
                  [/^\[(.*)\]$/s, 'action'], [/^\((.*)\)$/s, 'action']];
  const label = s => s.trim().replace(/^"(.*)"$/, '$1').replace(/#quot;/g, '"').trim();
  const node = (id, shape) => {
    let n = ids.get(id);
    if (!n){ n = {t:'action', name:id}; ids.set(id, n); P.nodes.push(n); }
    if (shape) for (const [re, t] of SHAPES){ const m = re.exec(shape); if (m){ n.t = t; n.name = label(m[1]); break; } }
    return n;
  };
  const NODE = /\s*([\p{L}_][\p{L}\w]*)\s*(\(\[.*?\]\)|\(\(.*?\)\)|\{.*?\}|\[.*?\]|\(.*?\))?/uy;
  const EDGE = /\s*(?:--\s*([^\s>|-][^>|]*?)\s*-->|-->|---|-\.->|==>)\s*(?:\|([^|]*)\|)?/y;
  text.split('\n').forEach((raw, i) => {
    const s = raw.trim().replace(/;$/, ''), ln = i+1;
    if (!s || s.startsWith('%%') || /^(flowchart|graph)\b/i.test(s)) return;
    NODE.lastIndex = 0;
    let m = NODE.exec(s);
    if (!m){ P.errors.push({ln, msg:`je ne comprends pas « ${s} »`}); return; }
    let prev = node(m[1], m[2]), pos = NODE.lastIndex;
    while (s.slice(pos).trim()){
      EDGE.lastIndex = pos;
      const e = EDGE.exec(s);
      if (!e){ P.errors.push({ln, msg:`je ne comprends pas « ${s.slice(pos).trim()} »`}); return; }
      NODE.lastIndex = EDGE.lastIndex;
      const n2 = NODE.exec(s);
      if (!n2){ P.errors.push({ln, msg:'une flèche attend un élément après elle'}); return; }
      const next = node(n2[1], n2[2]);
      P.rels.push({a:prev, b:next, type:'flow', ma:'', mb:'', name:label(e[1] || e[2] || '')});
      prev = next; pos = NODE.lastIndex;
    }
  });
  return P;
}

/* Mermaid state diagram: [*] is the initial state on the left of an
   arrow, the final one on its right */
const sid = n => ident(n.name) ? n.name : null;
function mermaidState(){
  const id = new Map(); let k = 0;
  const states = S.nodes.filter(n => n.t==='state');
  for (const n of states) id.set(n.id, sid(n) || 's'+(++k));
  const linked = new Set(S.rels.flatMap(r => [r.a, r.b]));
  let o = 'stateDiagram-v2\n';
  for (const n of states){
    if (id.get(n.id)!==n.name) o += `  state "${n.name.replace(/"/g, "'")}" as ${id.get(n.id)}\n`;
    else if (!n.body.length && !linked.has(n.id)) o += `  ${n.name}\n`;
    for (const l of n.body) o += `  ${id.get(n.id)} : ${l}\n`;
  }
  const byId = new Map(S.nodes.map(n => [n.id, n]));
  const end = (x, left) => x.t==='initial' ? (left ? '[*]' : null) : x.t==='final' ? (left ? null : '[*]') : id.get(x.id);
  for (const r of S.rels){
    const a = byId.get(r.a), b = byId.get(r.b); if (!a || !b) continue;
    const f = end(a, true), t = end(b, false); if (!f || !t) continue;
    o += `  ${f} --> ${t}${r.name ? ' : '+r.name : ''}\n`;
  }
  return o;
}
function parseState(text){
  const P = {nodes:[], rels:[], errors:[]}, keys = new Map(); let ini = null, fin = null;
  const decl = (name, alias) => {
    let n = keys.get(alias || name) || keys.get(name);
    if (!n){ n = {t:'state', name, body:[]}; P.nodes.push(n); }
    keys.set(name, n); if (alias) keys.set(alias, n);
    return n;
  };
  const ref = (tok, left) => {
    if (tok!=='[*]') return keys.get(tok) || decl(tok);
    if (left){ if (!ini){ ini = {t:'initial', name:'', body:[]}; P.nodes.push(ini); } return ini; }
    if (!fin){ fin = {t:'final', name:'', body:[]}; P.nodes.push(fin); } return fin;
  };
  const ID = String.raw`[\p{L}_][\p{L}\w]*`;
  text.split('\n').forEach((raw, i) => {
    const s = raw.trim(), ln = i+1; let m;
    if (!s || s.startsWith('%%') || /^stateDiagram/.test(s) || /^direction\b/.test(s)) return;
    if ((m = new RegExp(`^state\\s+"([^"]+)"\\s+as\\s+(${ID})$`, 'u').exec(s))){ decl(m[1], m[2]); return; }
    if (/^state\b.*\{$/.test(s)){ P.errors.push({ln, msg:'les états composites ne sont pas pris en charge'}); return; }
    if ((m = new RegExp(`^state\\s+(${ID})$`, 'u').exec(s))){ decl(m[1]); return; }
    if ((m = new RegExp(`^(\\[\\*\\]|${ID})\\s*-->\\s*(\\[\\*\\]|${ID})\\s*(?::\\s*(.*))?$`, 'u').exec(s))){
      P.rels.push({a:ref(m[1], true), b:ref(m[2], false), type:'strans', ma:'', mb:'', name:(m[3] || '').trim()}); return;
    }
    if ((m = new RegExp(`^(${ID})\\s*:\\s*(.*)$`, 'u').exec(s))){ ref(m[1], true).body.push(m[2].trim()); return; }
    if ((m = new RegExp(`^(${ID})$`, 'u').exec(s))){ decl(m[1]); return; }
    P.errors.push({ln, msg:`je ne comprends pas « ${s} »`});
  });
  return P;
}

/* Mermaid ER diagram, crow's foot. An attribute is written `nom : type PK`

const LEFT = {'1':'||', '0..1':'|o', '1..*':'}|', '0..*':'}o'}, RIGHT = {'1':'||', '0..1':'o|', '1..*':'|{', '0..*':'o{'};

const erName = s => s.trim().replace(/\s+/g, '_');
function mermaidER(){

  for (const n of S.nodes){

    const a = byId.get(r.a), b = byId.get(r.b); if (!a || !b) continue;
    o += `  ${erName(a.name)} ${LEFT[r.ma] || '||'}--${RIGHT[r.mb] || 'o{'} ${erName(b.name)} : "${(r.name || '').replace(/"/g, "'")}"\n`;

function parseER(text){
  const P = {nodes:[], rels:[], errors:[]}, keys = new Map(); let cur = null;
  const decl = raw => {
    const name = raw.replace(/_/g, ' ');
    let n = keys.get(name);
    if (!n){ n = {t:'entity', name, body:[]}; keys.set(name, n); P.nodes.push(n); }
    return n;
  };
  const NAME = String.raw`[\p{L}\w-]+`;
  const REL_ER = new RegExp(`^(${NAME})\\s+(\\|\\||\\|o|o\\||\\}o|\\}\\|)(--|\\.\\.)(\\|\\||o\\||\\|o|o\\{|\\|\\{)\\s+(${NAME})\\s*(?::\\s*(.*))?$`, 'u');
  text.split('\n').forEach((raw, i) => {
    const s = raw.trim(), ln = i+1; let m;
    if (cur){
      if (s==='}'){ cur = null; return; }
      if (!s) return;
      if ((m = /^(\S+)\s+(\S+)((?:\s*,?\s*(?:PK|FK|UK))*)\s*(?:"[^"]*")?$/.exec(s))){
        const keys = m[3].replace(/,/g, ' ').trim().split(/\s+/).filter(Boolean).join(' ');
        cur.body.push(`${m[2]} : ${m[1]}${keys ? ' '+keys : ''}`);
      } else P.errors.push({ln, msg:`attribut attendu : type nom, pas « ${s} »`});
      return;
    }
    if (!s || s.startsWith('%%') || /^erDiagram\b/.test(s) || /^direction\b/.test(s)) return;
    if ((m = new RegExp(`^(${NAME})\\s*\\{\\s*(\\})?$`, 'u').exec(s))){ const n = decl(m[1]); n.body = []; if (!m[2]) cur = n; return; }
    if ((m = REL_ER.exec(s))){
      P.rels.push({a:decl(m[1]), b:decl(m[5]), type:'erel', ma:FROM_LEFT[m[2]], mb:FROM_RIGHT[m[4]], name:unq(m[6] || '')});
      return;
    }
    if ((m = new RegExp(`^(${NAME})$`, 'u').exec(s))){ decl(m[1]); return; }
    P.errors.push({ln, msg:`je ne comprends pas « ${s} »`});
  });
  if (cur) P.errors.push({ln:text.split('\n').length, msg:`l'entité « ${cur.name} » n'est pas fermée`});
  return P;
}

/* Graphviz DOT, for the automaton and the graph. The initial state is the
   target of an edge from a point-shaped node, the usual convention. */
function dotOut(){
  const aut = type==='automaton', q2 = n => ident(n.name) ? n.name : `"${n.name.replace(/"/g, "'")}"`;
  const byId = new Map(S.nodes.map(n => [n.id, n]));
  const directed = aut || S.rels.some(r => r.type==='arc'), op = directed ? '->' : '--';
  let o = (directed ? 'digraph' : 'graph') + ' {\n';
  if (aut) o += '  rankdir=LR\n  node [shape=circle]\n';
  for (const n of S.nodes) o += `  ${q2(n)}${aut && n.accept ? ' [shape=doublecircle]' : ''}\n`;
  const starts = S.nodes.filter(n => aut && n.initial);
  if (starts.length) o += '  __start [shape=point]\n' + starts.map(n => `  __start -> ${q2(n)}\n`).join('');
  for (const r of S.rels){
    const a = byId.get(r.a), b = byId.get(r.b); if (!a || !b) continue;
    const at = [];
    if (r.name) at.push(`label="${r.name.replace(/"/g, "'")}"`);
    if (directed && r.type==='edge') at.push('dir=none');
    o += `  ${q2(a)} ${op} ${q2(b)}${at.length ? ` [${at.join(', ')}]` : ''}\n`;
  }
  return o + '}\n';
}
function dotIn(text){
  const P = {nodes:[], rels:[], errors:[]}, keys = new Map(), aut = type==='automaton', pseudo = new Set();
  const decl = name => {
    let n = keys.get(name);
    if (!n){ n = {t:aut ? 'astate' : 'vertex', name, accept:false, initial:false}; keys.set(name, n); P.nodes.push(n); }
    return n;
  };
  const attrs = s => {
    const out = {};
    for (const m of (s || '').matchAll(/(\w+)\s*=\s*("[^"]*"|[^,;\s\]]+)/g)) out[m[1].toLowerCase()] = unq(m[2]);
    return out;
  };
  const ID = String.raw`"[^"]*"|[\p{L}\w.]+`;
  const EDGE_RE = new RegExp(`^(${ID})((?:\\s*(?:->|--)\\s*(?:${ID}))+)\\s*(?:\\[(.*)\\])?$`, 'u');
  const NODE_RE = new RegExp(`^(${ID})\\s*(?:\\[(.*)\\])?$`, 'u');
  const stmts = [];
  text.replace(/\/\*[\s\S]*?\*\//g, '').split('\n').forEach((raw, i) => {
    for (const part of raw.replace(/(^|\s)(\/\/|#).*$/, '').split(/;(?=(?:[^"]*"[^"]*")*[^"]*$)/)){
      const s = part.trim();
      if (s && s!=='{' && s!=='}' && !/^(strict\s+)?(di)?graph\b/i.test(s) && !/^\w+\s*=/.test(s)) stmts.push({s, ln:i+1});
    }
  });
  /* nodes first, so a point-shaped start is known before its edge */
  let def = '';
  const edges = [];
  for (const {s, ln} of stmts){
    let m;
    if ((m = /^(node|edge|graph)\s*\[(.*)\]$/i.exec(s))){ if (m[1].toLowerCase()==='node') def = attrs(m[2]).shape || def; continue; }
    if (EDGE_RE.test(s)){ edges.push({s, ln}); continue; }
    if ((m = NODE_RE.exec(s))){
      const name = unq(m[1]), shape = attrs(m[2]).shape || def;
      if (aut && /^(point|none|plaintext)$/.test(shape)){ pseudo.add(name); continue; }
      const n = decl(name); if (aut) n.accept = shape==='doublecircle';
      continue;
    }
    P.errors.push({ln, msg:`je ne comprends pas « ${s} »`});
  }
  for (const {s, ln} of edges){
    const m = EDGE_RE.exec(s), at = attrs(m[3]);
    let prev = unq(m[1]);
    for (const e of m[2].matchAll(new RegExp(`\\s*(->|--)\\s*(${ID})`, 'gu'))){
      const next = unq(e[2]);
      if (pseudo.has(prev)) decl(next).initial = true;
      else {
        const t = aut ? 'trans' : (e[1]==='--' || at.dir==='none') ? 'edge' : 'arc';
        if (aut && e[1]==='--'){ P.errors.push({ln, msg:'un automate est orienté : -> attendu'}); return P; }
        P.rels.push({a:decl(prev), b:decl(next), type:t, ma:'', mb:'', name:at.label || at.weight || ''});
      }
      prev = next;
    }
  }
  return P;
}
const CODECS = {class:[plantuml, parse], usecase:[plantuml, parse], flow:[mermaid, parseMermaid],
  state:[mermaidState, parseState], er:[mermaidER, parseER], automaton:[dotOut, dotIn], graph:[dotOut, dotIn]};

/* A new flowchart node goes 40 below the node that flows into it, or
   below everything, and steps right until it overlaps nothing. */
function placeFlow(ns, freshN, right){
  const byId = new Map(S.nodes.map(n => [n.id, n]));
  const taken = S.nodes.filter(n => !freshN.has(n)).map(rectOf);
  const free = r => taken.every(q => r.x1+20 <= q.x0 || r.x0 >= q.x1+20 || r.y1+20 <= q.y0 || r.y0 >= q.y1+20);
  for (const n of ns){
    const {w,h} = sizeOf(n);
    const src = S.rels.map(r => r.b===n.id && byId.get(r.a)).find(a => a && !freshN.has(a));
    let cx = 400, y = 40;
    if (src){ const R = rectOf(src); cx = right ? R.x1+80+w/2 : (R.x0+R.x1)/2; y = right ? snap((R.y0+R.y1-h)/2) : R.y1+40; }
    else if (taken.length){ cx = (Math.min(...taken.map(r => r.x0)) + Math.max(...taken.map(r => r.x1)))/2; y = Math.max(...taken.map(r => r.y1))+40; }
    let x = snap(cx-w/2);
    for (let k = 0; k < 40 && !free({x0:x, y0:y, x1:x+w, y1:y+h}); k++) right ? (y += 80) : (x += 160);
    n.x = x; n.y = y; taken.push(rectOf(n)); freshN.delete(n);
  }
}

/* Operations */
function nextName(t){
  if (t==='terminal') return S.nodes.some(n => n.t==='terminal' && n.name==='Début') ? 'Fin' : 'Début';
  if (NAMELESS.has(t)) return '';
  const names = new Set(S.nodes.map(n => n.name));
  if (t==='astate'){ let i = 0; while (names.has('q'+i)) i++; return 'q'+i; }
  if (t==='vertex'){
    const l = [...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'].find(c => !names.has(c));
    if (l) return l;
  }
  const p = PREFIX[t], re = new RegExp('^'+p+'(\\d+)$'); let n = 0;
  for (const x of S.nodes){ const m = re.exec(x.name); if (m) n = Math.max(n, +m[1]); }
  return p+(n+1);
}
/* A new class has two empty compartments, the usual shape */
function ghostNode(tool){
  const {t, accept} = TOOLKIND[tool] || {t:tool};
  const [w, h] = SHAPE_SIZE[t] || [280, 240];
  return {id:'ghost', t, x:0, y:0, name:SHAPES.has(t) ? '' : nextName(t), stereo:'', abstract:false, w, h,
    body:t==='class' ? ['---'] : t==='entity' ? ['id : int PK'] : [],
    accept:!!accept, initial:t==='astate' && !S.nodes.some(n => n.initial)};
}
function newNode(t, cx, cy){
  const n = ghostNode(t), {w,h} = sizeOf(n);
  n.id = 'k'+S.seq++; n.x = snap(cx-w/2); n.y = snap(cy-h/2);
  return n;
}
function enterPlace(t){ mode = 'place'; placeT = t; draft = null; hover = null; render(); }
function enterLink(k){ relType = k; mode = 'link'; placeT = null; render(); }
function setMode(m){ mode = m; if (m!=='place') placeT = null; if (m!=='link') draft = null; hover = null; render(); }
function placeAt(t, cx, cy){
  pushUndo(); const n = newNode(t, cx, cy);
  t==='system' ? S.nodes.unshift(n) : S.nodes.push(n);
  sel = new Set([n.id]); save(); render();
}
function linkedRels(ids){ return S.rels.filter(r => sel.has(r.id) || (ids.has(r.a) && ids.has(r.b))); }
function del(){
  if (!sel.size) return; pushUndo();
  S.nodes = S.nodes.filter(n => !sel.has(n.id));
  S.rels = S.rels.filter(r => !sel.has(r.id) && !sel.has(r.a) && !sel.has(r.b));
  sel.clear(); save(); render();
}
function duplicate(){
  const ns = S.nodes.filter(n => sel.has(n.id)); if (!ns.length) return; pushUndo();
  const map = new Map(), nsel = new Set(), off = 40;
  for (const n of ns){
    const c = JSON.parse(JSON.stringify(n)); c.id = 'k'+S.seq++; c.x += off; c.y += off;
    S.nodes.push(c); map.set(n.id, c.id); nsel.add(c.id);
  }
  for (const r of S.rels.filter(r => map.has(r.a) && map.has(r.b))){
    const c = {...r, id:'r'+S.seq++, a:map.get(r.a), b:map.get(r.b), via:r.via.map(v => ({x:v.x+off, y:v.y+off}))};
    S.rels.push(c); nsel.add(c.id);

  const rs = S.rels.filter(r => sel.has(r.id)); if (!rs.length) return; pushUndo();
  for (const r of rs){ [r.a, r.b] = [r.b, r.a]; [r.ma, r.mb] = [r.mb, r.ma]; r.via.reverse(); }
  inspId = null; save(); render();

/* Moving a system carries what it holds */
function captureMove(d){
  const ids = new Set(S.nodes.filter(n => sel.has(n.id)).map(n => n.id));
  for (const s of S.nodes) if (s.t==='system' && ids.has(s.id)){
    const R = rectOf(s);
    for (const n of S.nodes) if (n.t!=='system' && holds(R, rectOf(n))) ids.add(n.id);
  }
  d.orig = new Map(S.nodes.filter(n => ids.has(n.id)).map(n => [n.id, [n.x, n.y]]));
  d.vorig = new Map(linkedRels(ids).map(r => [r.id, r.via.map(v => ({...v}))]));
}
function applyMove(d){
  for (const n of S.nodes){ const o = d.orig.get(n.id); if (o){ n.x = o[0]+d.dx; n.y = o[1]+d.dy; } }
  for (const r of S.rels){ const o = d.vorig.get(r.id); if (o) r.via = o.map(v => ({x:v.x+d.dx, y:v.y+d.dy})); }
}
function boxSelect(d){
  const x0 = Math.min(d.x0,d.x1), x1 = Math.max(d.x0,d.x1), y0 = Math.min(d.y0,d.y1), y1 = Math.max(d.y0,d.y1);
  sel = new Set(d.base);
  for (const n of S.nodes){
    const R = rects.get(n.id); if (!R) continue;
    const hit = n.t==='system' ? R.x0>=x0 && R.x1<=x1 && R.y0>=y0 && R.y1<=y1 : R.x1>=x0 && R.x0<=x1 && R.y1>=y0 && R.y0<=y1;
    if (hit) sel.add(n.id);
  }

/* Where a point falls along a polyline, as a distance from its start */
function arcPos(pts, p){
  let acc = 0, best = Infinity, at = 0;
  for (let i = 0; i < pts.length-1; i++){
    const [ax,ay] = pts[i], [bx,by] = pts[i+1], L = Math.hypot(bx-ax, by-ay);
    const t = L ? Math.max(0, Math.min(1, ((p.x-ax)*(bx-ax)+(p.y-ay)*(by-ay))/(L*L))) : 0;
    const dd = Math.hypot(ax+t*(bx-ax)-p.x, ay+t*(by-ay)-p.y);
    if (dd < best){ best = dd; at = acc+t*L; }
    acc += L;
  }
  return at;
}
function insertVia(rid, p){
  const r = S.rels.find(x => x.id===rid), L = routes.get(rid); if (!r || !L) return;
  const pos = arcPos(L.pts, p), i = r.via.filter(v => arcPos(L.pts, v) < pos).length;
  pushUndo(); r.via.splice(i, 0, p); sel = new Set([rid]); save(); render();
}

/* Pointer */
function toWorld(e){
  const r = svg.getBoundingClientRect();
  return {x:(e.clientX-r.left-view.x)/view.k, y:(e.clientY-r.top-view.y)/view.k,
          inside:e.clientX>=r.left && e.clientX<=r.right && e.clientY>=r.top && e.clientY<=r.bottom};

/* after the mousedown that follows this pointerdown, or it takes the focus back */
function focusLater(el, line){
  setTimeout(() => {
    el.focus();
    if (el.tagName==='INPUT') el.select();
    else if (line!==undefined){
      const at = el.value.split('\n').slice(0, line+1).join('\n').length;
      el.setSelectionRange(at, at);
    }

}
function doubleClick(t, w){
  const re = t.closest('[data-rel]');
  if (re && !t.closest('[data-via]')){ insertVia(re.dataset.rel, {x:snap(w.x), y:snap(w.y)}); return; }
  const hit = nodeAt(w.x, w.y);
  if (hit){
    const n = S.nodes.find(x => x.id===hit.id), ly = w.y-n.y;
    sel = new Set([n.id]); inspId = null; render();
    if (NAMELESS.has(n.t)) return;
    if (!BODIED.has(n.t)){ focusLater(nName); return; }
    if (ly < HEAD){ focusLater(cName); return; }
    if (n.t==='state'){ focusLater(cBody, Math.max(0, Math.min(n.body.length-1, Math.floor((ly-HEAD-PAD/2)/ROW)))); return; }
    /* the body line under the pointer: walk the compartments, counting the `---` between them */
    let y = HEAD, start = 0, line = Math.max(0, n.body.length-1);
    for (const k of compartments(n)){
      const end = y + k.length*ROW + PAD;
      if (ly < end){ line = start + Math.max(0, Math.min(k.length-1, Math.floor((ly-y-PAD/2)/ROW))); break; }
      y = end; start += k.length + 1;
    }
    focusLater(cBody, line);
    return;
  }
  if (t.closest('[data-via]')) return;
  const kind = DIAGRAMS[type].dbl;

  }
  if (e.button!==0) return;

  const rz = t.closest('[data-resize]');

  const hit = nodeAt(w.x, w.y), re = t.closest('[data-rel]');
  if (hit && hit.edge && !re && !e.shiftKey && DIAGRAMS[type].rels.length){
    startLink(hit.id, 'select'); drag = {kind:'link', cx:w.x, cy:w.y, moved:false}; render(); return;
  }
  const id = re ? re.dataset.rel : hit ? hit.id : null;
  if (id){
    const was = sel.has(id);
    if (e.shiftKey){ was ? sel.delete(id) : sel.add(id); }
    else if (!was){ sel = new Set([id]); }
    if (sel.has(id)){
      drag = {kind:'move', sx:w.x, sy:w.y, dx:0, dy:0, moved:false, snapS:JSON.stringify(S), collapse:(!e.shiftKey && was) ? id : null};
      captureMove(drag);
    }
    render(); return;
  }
  drag = {kind:'box', x0:w.x, y0:w.y, x1:w.x, y1:w.y, base:e.shiftKey ? new Set(sel) : new Set()};
  if (!e.shiftKey) sel.clear();
  render();
});
window.addEventListener('pointermove', e => {
  const w = toWorld(e); lastW = w; cursorIn = w.inside; cursor = {x:snap(w.x), y:snap(w.y)};
  if (palDrag && Math.hypot(e.clientX-palDrag.x, e.clientY-palDrag.y) > 5) palDrag.moved = true;
  if (mode==='place' && placeT){
    const {w:gw, h:gh} = sizeOf(ghostNode(placeT));
    ghost.x = snap(w.x-gw/2); ghost.y = snap(w.y-gh/2); ghost.show = w.inside;
  }
  if (!drag || drag.kind==='link'){
    const linking = mode==='link' || (drag && drag.kind==='link');
    hover = w.inside && mode!=='place' ? nodeAt(w.x, w.y, !linking) : null;
  }
  if (drag){
    if (drag.kind==='pan'){
      const dx = e.clientX-drag.cx, dy = e.clientY-drag.cy;
      if (Math.abs(dx)+Math.abs(dy) > 3) drag.moved = true;
      view.x = drag.vx+dx; view.y = drag.vy+dy;
    } else if (drag.kind==='move'){
      const dx = snap(w.x-drag.sx), dy = snap(w.y-drag.sy);
      if (dx!==drag.dx || dy!==drag.dy){ drag.dx = dx; drag.dy = dy; drag.moved = true; applyMove(drag); }
    } else if (drag.kind==='box'){
      drag.x1 = w.x; drag.y1 = w.y; boxSelect(drag);
    } else if (drag.kind==='via'){
      const v = S.rels.find(x => x.id===drag.rid).via[drag.i];
      if (v.x!==cursor.x || v.y!==cursor.y){ v.x = cursor.x; v.y = cursor.y; drag.moved = true; }
    } else if (drag.kind==='resize'){
      const n = S.nodes.find(x => x.id===drag.id);
      /* a square and a circle keep their aspect */
      const min = n.t==='system' ? [160, 120] : [G, G];
      let nw = Math.max(min[0], cursor.x-n.x), nh = Math.max(min[1], cursor.y-n.y);
      if (n.t==='square' || n.t==='circle') nw = nh = Math.max(nw, nh);
      if (nw!==n.w || nh!==n.h){ n.w = nw; n.h = nh; drag.moved = true; }
    } else if (drag.kind==='link'){
      if (Math.hypot(w.x-drag.cx, w.y-drag.cy) > 8) drag.moved = true;
    } else if (drag.kind==='ink'){
      const P = drag.pts;
      if (drag.t==='line') P[1] = [cursor.x, cursor.y];
      else if (Math.hypot(w.x-P[P.length-1][0], w.y-P[P.length-1][1]) > 3) P.push([w.x, w.y]);
    }
  }
  requestRender();
});
window.addEventListener('pointerup', e => {
  if (palDrag){
    const pd = palDrag; palDrag = null;
    if (pd.moved){
      const w = toWorld(e);
      if (w.inside && !INK.has(placeT)) placeAt(placeT, w.x, w.y);
      setMode('select');
    } else if (pd.same) setMode('select');
    render(); return;
  }
  if (!drag) return;
  const d = drag; drag = null;
  if (d.kind==='pan'){ if (!d.moved && d.btn===2) cancelStep(); save(); }
  else if (d.kind==='move' || d.kind==='via' || d.kind==='resize'){
    if (d.moved){ undoS().push(d.snapS); hist[type].r = []; save(); }
    else if (d.collapse && !e.shiftKey) sel = new Set([d.collapse]);
  } else if (d.kind==='ink'){
    const P = d.t==='stroke' ? d.pts.slice(1) : d.pts;
    if (Math.hypot(P[P.length-1][0]-P[0][0], P[P.length-1][1]-P[0][1]) > 4 || P.length > 3){
      pushUndo(); const n = inkNode(d.t, P); S.nodes.push(n); save();
    }
  } else if (d.kind==='link' && d.moved && draft){
    /* a drag from a node: released on another one links them, released
       on the grid drops the drawing; a click-click keeps it going */
    if (hover && hover.id!==draft.a) finishLink(hover.id);
    else if (!hover) cancelDraft();
  }
  render();
});
svg.addEventListener('pointerleave', () => { cursorIn = false; if (mode==='place' && !palDrag) ghost.show = false; requestRender(); });
svg.addEventListener('wheel', e => {
  e.preventDefault();
  const r = svg.getBoundingClientRect(), sx = e.clientX-r.left, sy = e.clientY-r.top;
  const k2 = Math.min(4, Math.max(.25, view.k*Math.exp(-e.deltaY*.0015)));
  view.x = sx-(sx-view.x)*k2/view.k; view.y = sy-(sy-view.y)*k2/view.k; view.k = k2;
  requestRender(); save();
}, {passive:false});

/* Keyboard */
window.addEventListener('keydown', e => {
  if (e.target.matches && e.target.matches('input,textarea')) return;
  const k = e.key, lk = k.toLowerCase(), mod = e.ctrlKey || e.metaKey;
  if (mod){
    if (lk==='z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); }
    else if (lk==='y'){ e.preventDefault(); redo(); }
    if (pane!=='draw') return;
    if (lk==='d'){ e.preventDefault(); duplicate(); }
    else if (lk==='a'){ e.preventDefault(); sel = new Set([...S.nodes, ...S.rels].map(x => x.id)); render(); }
    return;
  }
  if (pane!=='draw') return;
  if (lk==='i'){ swapSel(); }
  else if (k==='F2' || k==='Enter'){
    const n = sel.size===1 && findById([...sel][0]);
    if (n && isNode(n.id)){ e.preventDefault(); const el = n.t==='class' ? cName : nName; el.focus(); el.select(); }
  }
  else if (k==='Delete' || k==='Backspace'){ e.preventDefault(); del(); }
  else if (k==='Escape'){
    if (draft) cancelDraft(); else if (mode!=='select') setMode('select'); else sel.clear();
    render();
  } else if (/^[1-9]$/.test(k)){
    const tool = toolList()[+k-1];
    if (tool && tool.place){ enterPlace(tool.place); ghost.show = cursorIn; render(); }
    else if (tool) enterLink(tool.rel);
  }
});
window.addEventListener('resize', requestRender);

/* Starting examples */
const DEMOS = {
  class(){
    const add = (x, y, name, o={}) => {
      const n = {id:'k'+S.seq++, t:'class', x, y, name, stereo:o.stereo||'', abstract:!!o.abstract, body:o.body||[]};
      S.nodes.push(n); return n.id;
    };
    const rel = (type, a, b, o={}) => S.rels.push({id:'r'+S.seq++, type, a, b, via:[], name:o.name||'', ma:o.ma||'', mb:o.mb||''});
    const forme = add(380, 20, 'Forme', {stereo:'interface', body:['+ aire() : double', '+ perimetre() : double']});
    const fig = add(320, 220, 'Figure', {abstract:true, body:['# couleur : Couleur', '# origine : Point', '---',
      '+ deplacer(dx : double, dy : double) : void', '+ aire() : double {abstract}']});
    const cer = add(180, 460, 'Cercle', {body:['- rayon : double', '---', '+ aire() : double', '+ perimetre() : double']});
    const rec = add(520, 460, 'Rectangle', {body:['- largeur : double', '- hauteur : double', '---', '+ aire() : double', '+ perimetre() : double']});
    const col = add(820, 240, 'Couleur', {stereo:'enumeration', body:['ROUGE', 'VERT', 'BLEU']});
    const des = add(-60, 200, 'Dessin', {body:['- titre : String', '---', '+ ajouter(f : Forme) : void', '+ vide() : Dessin {static}']});
    rel('impl', fig, forme);
    rel('inh', cer, fig);
    rel('inh', rec, fig);
    rel('nav', fig, col, {mb:'1'});
    rel('comp', forme, des, {ma:'0..*', mb:'1', name:'contient'});
  },
  usecase(){
    const add = (t, x, y, name, o={}) => {
      const n = {id:'k'+S.seq++, t, x, y, name, stereo:'', abstract:false, body:[], w:o.w||280, h:o.h||240};
      S.nodes.push(n); return n.id;
    };
    const rel = (type, a, b) => S.rels.push({id:'r'+S.seq++, type, a, b, via:[], name:'', ma:'', mb:''});
    add('system', 240, 20, 'Boutique en ligne', {w:480, h:440});
    const client = add('actor', 100, 120, 'Client');
    const membre = add('actor', 100, 320, 'Membre');
    const gest = add('actor', 820, 60, 'Gestionnaire');
    const cat = add('usecase', 280, 60, 'Consulter le catalogue');
    const cmd = add('usecase', 280, 200, 'Passer une commande');
    const ident = add('usecase', 520, 320, "S'identifier");
    const promo = add('usecase', 280, 360, 'Appliquer un code promo');
    const prod = add('usecase', 520, 60, 'Gérer les produits');
    rel('assoc', client, cat);
    rel('assoc', client, cmd);
    rel('inh', membre, client);
    rel('assoc', gest, prod);
    rel('incl', cmd, ident);
    rel('incl', prod, ident);
    rel('ext', promo, cmd);
  },
  flow(){
    const add = (t, x, y, name) => { const n = {id:'k'+S.seq++, t, x, y, name, stereo:'', abstract:false, body:[]}; S.nodes.push(n); return n.id; };
    const rel = (a, b, name='', via=[]) => S.rels.push({id:'r'+S.seq++, type:'flow', a, b, via, name, ma:'', mb:''});
    const deb = add('terminal', 340, 20, 'Début');
    const lire = add('action', 340, 100, 'Lire n');
    const init = add('action', 340, 180, 'f ← 1 ; i ← 1');
    const test = add('decision', 340, 260, 'i ≤ n ?');
    const mul = add('action', 340, 400, 'f ← f × i');
    const inc = add('action', 340, 480, 'i ← i + 1');
    const aff = add('action', 540, 280, 'Afficher f');
    const fin = add('terminal', 540, 380, 'Fin');
    rel(deb, lire); rel(lire, init); rel(init, test);
    rel(test, mul, 'oui'); rel(mul, inc);
    rel(inc, test, '', [{x:260, y:500}, {x:260, y:300}]);
    rel(test, aff, 'non'); rel(aff, fin);
  },
  state(){
    const add = (t, x, y, name='', body=[]) => { const n = {id:'k'+S.seq++, t, x, y, name, stereo:'', abstract:false, body}; S.nodes.push(n); return n.id; };
    const rel = (a, b, name='') => S.rels.push({id:'r'+S.seq++, type:'strans', a, b, via:[], name, ma:'', mb:''});
    const ini = add('initial', 60, 120);
    const fer = add('state', 180, 120, 'Fermée');
    const ouv = add('state', 480, 0, 'Ouverte', ['entry / allumer la lampe', 'exit / éteindre la lampe']);
    const ver = add('state', 480, 220, 'Verrouillée');
    const fin = add('final', 760, 220);
    rel(ini, fer); rel(fer, ouv, 'ouvrir'); rel(ouv, fer, 'fermer');
    rel(fer, ver, 'verrouiller [code ok]'); rel(ver, fer, 'déverrouiller [code ok]'); rel(ver, fin, 'mise hors service');
  },
  er(){
    const add = (x, y, name, body) => { const n = {id:'k'+S.seq++, t:'entity', x, y, name, stereo:'', abstract:false, body}; S.nodes.push(n); return n.id; };
    const rel = (a, b, ma, mb, name) => S.rels.push({id:'r'+S.seq++, type:'erel', a, b, via:[], name, ma, mb});
    const cli = add(20, 40, 'Client', ['id : int PK', 'nom : string', 'email : string']);
    const cmd = add(360, 40, 'Commande', ['numero : int PK', 'date : date', 'client_id : int FK']);
    const lig = add(360, 280, 'LigneCommande', ['commande_id : int PK FK', 'produit_ref : string PK FK', 'quantite : int']);
    const pro = add(760, 280, 'Produit', ['ref : string PK', 'libelle : string', 'prix : decimal']);
    rel(cli, cmd, '1', '0..*', 'passe');
    rel(cmd, lig, '1', '1..*', 'contient');
    rel(pro, lig, '1', '0..*', 'figure dans');
  },
  automaton(){
    /* the words over {a, b} that end with ab */
    const add = (x, y, name, o={}) => { const n = {id:'k'+S.seq++, t:'astate', x, y, name, stereo:'', abstract:false, body:[], accept:!!o.accept, initial:!!o.initial}; S.nodes.push(n); return n.id; };
    const rel = (a, b, name, via=[]) => S.rels.push({id:'r'+S.seq++, type:'trans', a, b, via, name, ma:'', mb:''});
    const q0 = add(120, 160, 'q0', {initial:true}), q1 = add(320, 160, 'q1'), q2 = add(520, 160, 'q2', {accept:true});
    rel(q0, q0, 'b'); rel(q0, q1, 'a'); rel(q1, q1, 'a'); rel(q1, q2, 'b'); rel(q2, q1, 'a');
    rel(q2, q0, 'b', [{x:340, y:300}]);
  },
  graph(){
    const add = (x, y, name) => { const n = {id:'k'+S.seq++, t:'vertex', x, y, name, stereo:'', abstract:false, body:[]}; S.nodes.push(n); return n.id; };
    const rel = (a, b, name) => S.rels.push({id:'r'+S.seq++, type:'edge', a, b, via:[], name, ma:'', mb:''});
    const A = add(100, 160, 'A'), B = add(300, 60, 'B'), C = add(300, 280, 'C'), D = add(500, 60, 'D'), E = add(500, 280, 'E'), F = add(700, 160, 'F');
    rel(A, B, '4'); rel(A, C, '2'); rel(B, C, '1'); rel(B, D, '5'); rel(C, D, '8');
    rel(C, E, '10'); rel(D, E, '2'); rel(D, F, '6'); rel(E, F, '3');
  },
  free(){
    const shape = (t, x, y, w, h, name='') => S.nodes.push({id:'k'+S.seq++, t, x, y, w, h, name, stereo:'', abstract:false, body:[]});
    shape('triangle', 200, 80, 200, 100);
    shape('rect', 220, 180, 160, 140, 'Maison');
    shape('square', 230, 200, 40, 40);
    shape('rect', 320, 260, 40, 60);
    shape('circle', 520, 60, 60, 60);
    S.nodes.push(inkNode('line', [[100, 320], [640, 320]]));
    S.nodes.push(inkNode('stroke', [[350, 110], [358, 96], [352, 82], [362, 68], [356, 54], [366, 40]]));
  }
};

if (!load()){
  for (const t of Object.keys(DIAGRAMS).reverse()){ type = t; S = docs[t]; DEMOS[t](); }
}
relType = DIAGRAMS[type].rels[0];
buildTools();
setPane('draw');
if (document.fonts && document.fonts.ready) document.fonts.ready.then(render);
})();
