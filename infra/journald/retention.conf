# The system journal's retention, on BOTH VMs (#872). Installed by the
# operator as /etc/systemd/journald.conf.d/retention.conf, never by a deploy
# (docs/development/deployment.md §7, Host logs).
#
# 180 days: the system journal holds the `sudo` trail of who did what
# (deployment.md, Human access), which fail2ban reads too, and it is kept
# longer than the services' own logs (30 days: journald@quiz.conf and the
# compose files). journald deletes a whole journal file at a time; a file
# spanning a week instead of the default month keeps that cut within a week
# of the period.
[Journal]
MaxRetentionSec=180day
MaxFileSec=1week
