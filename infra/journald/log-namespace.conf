# Quadlet drop-in: the unit logs into the journal namespace `quiz`, kept 30
# days (journald@quiz.conf beside this file), not into the system journal.
# Installed by the operator, never by a deploy, as
#   /etc/containers/systemd/quiz-runner.container.d/log-namespace.conf
#   /etc/containers/systemd/quiz-codespace-prod.container.d/log-namespace.conf
#   /etc/containers/systemd/quiz-codespace-staging.container.d/log-namespace.conf
# (docs/development/deployment.md §7, Host logs). The unit's log is then
# `journalctl --namespace=quiz -u <unit>`; `podman logs` no longer shows it.
#
# systemd implements a namespace with a mount namespace of the unit's own
# (systemd.exec(5), LogNamespace=): the mounts its `podman run` makes for
# the container are not seen from the host. Never give it to a Podman API
# service (podman.service, quiz-runner-podman.service), whose mounts other
# containers need.
[Service]
LogNamespace=quiz
