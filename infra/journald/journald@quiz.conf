# The journal namespace `quiz` of the engine VM (#872): the runner and the
# two workspace portals log here (log-namespace.conf), not into the system
# journal. Installed by the operator as /etc/systemd/journald@quiz.conf,
# never by a deploy (docs/development/deployment.md §7, Host logs). A
# namespace reads this file and its own drop-ins only, never journald.conf.
#
# 30 days: the portals' request log holds every student's address
# (apps/codespace/src/logging.ts). journald deletes a whole journal file at
# a time; a file spanning a day instead of the default month keeps that cut
# within a day of the period.
[Journal]
MaxRetentionSec=30day
MaxFileSec=1day
