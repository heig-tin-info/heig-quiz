# The `sudo` and SSH trail on BOTH VMs (#872), installed by hand as
# /etc/rsyslog.d/40-auth-trail.conf: the auth facilities go to their own
# file, rotated by auth-trail.logrotate, and rsyslog writes nothing else
# (`*.* stop`: the packaged 50-default.conf never runs, so /var/log/syslog
# and /var/log/auth.log stay empty and the journal stays the only copy of
# everything else). The period and why: docs/development/deployment.md §7,
# Host logs.
auth,authpriv.* /var/log/auth-trail.log
*.* stop
