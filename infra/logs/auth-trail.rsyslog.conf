# The `sudo` and SSH trail on BOTH VMs (#872), installed by hand as
# /etc/rsyslog.d/40-auth-trail.conf: the auth facilities go to their own
# file, rotated by auth-trail.logrotate, and nowhere else (`stop`: the
# packaged 50-default.conf's /var/log/auth.log stays empty). The period and
# why: docs/development/deployment.md §7, Host logs.
auth,authpriv.* /var/log/auth-trail.log
& stop
