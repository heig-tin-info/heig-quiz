# The system journal on BOTH VMs (#872), installed by hand as
# /etc/systemd/journald.conf.d/retention.conf. The period and why:
# docs/development/deployment.md §7, Host logs.
#
# journald deletes a whole journal file at a time: files of one day, not
# the default month, keep that cut within a day of MaxRetentionSec.
# ForwardToSyslog hands the `sudo` and SSH lines to rsyslog, which keeps
# them longer (auth-trail.rsyslog.conf); Debian's default, written out.
[Journal]
MaxRetentionSec=30day
MaxFileSec=1day
ForwardToSyslog=yes
