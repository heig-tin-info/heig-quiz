# /etc/quiz-runner/containers.conf — read by quiz-runner-podman.service ONLY
# (CONTAINERS_CONF_OVERRIDE), on top of the system's containers.conf. Installed
# by apps/runner/deploy/install-gvisor.sh.
#
# gVisor is the default runtime of that service: a `--remote` client cannot
# ask for it per container. The `runsc` entry is the wrapper the script
# writes, which runs runsc with `--oci-seccomp`: without that flag runsc
# IGNORES the OCI spec's seccomp profile, and the runner's
# `--security-opt seccomp=…` (invariant 12) would be configured, not applied.
[engine]
runtime = "runsc"

[engine.runtimes]
runsc = ["/usr/local/libexec/quiz-runner/runsc"]
