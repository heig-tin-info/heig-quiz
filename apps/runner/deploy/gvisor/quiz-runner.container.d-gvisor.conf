# Quadlet drop-in pointing the runner at its gVisor socket, installed by the
# operator, never by a deploy: apps/runner/README.md, Switching production to gVisor.
[Unit]
Requires=quiz-runner-podman.socket
After=quiz-runner-podman.socket

[Container]
Volume=/run/quiz-runner-podman/podman.sock:/run/quiz-runner-podman/podman.sock
