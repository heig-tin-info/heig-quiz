# Quadlet drop-in that points the runner at the gVisor socket. NOT installed by
# any script or deploy: the operator copies it, once install-gvisor.sh has run,
# as /etc/containers/systemd/quiz-runner.container.d/gvisor.conf, and sets in
# /etc/quiz-runner/env
#   PODMAN_SOCKET=/run/quiz-runner-podman/podman.sock
#   RUNNER_RUNTIME=runsc
# then `systemctl daemon-reload && systemctl restart quiz-runner`. The runner
# then refuses to start unless a hardened container runs under gVisor
# (apps/runner/README.md, In production). Removing this file and the two lines
# is the way back.
[Unit]
Requires=quiz-runner-podman.socket
After=quiz-runner-podman.socket

[Container]
Volume=/run/quiz-runner-podman/podman.sock:/run/quiz-runner-podman/podman.sock
