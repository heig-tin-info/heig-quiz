# /etc/sysctl.d/60-quiz-codespace.conf on the engine VM, installed and
# applied by lib.sh (cs_install_host) at every bootstrap and prod deploy.
#
# inotify. The kernel charges an inotify instance or watch to its user AND
# to the creator of every enclosing user namespace (kernel/ucount.c,
# inc_ucount walks up the namespaces): the session containers' namespaces
# (--userns=auto) are created by root, so every session's code-server,
# extension host and file watchers draw on ONE budget, root's in the host
# namespace, shared with the host's own root daemons. The default of 128
# instances is a few sessions' worth; a watcher that cannot get one fails
# with "ENOSPC"/"too many open files" in the student's editor. The watches'
# default scales with the RAM at boot (30571 on the 3.8 GB VM); 524288 is a
# ceiling, the kernel memory is only taken by watches actually created.
fs.inotify.max_user_instances = 4096
fs.inotify.max_user_watches = 524288
