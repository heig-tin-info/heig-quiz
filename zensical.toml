[project]
site_name = "HEIG Quiz"
site_description = "A quiz platform for HEIG-VD teachers: question pools, live evaluations with a server-side clock, automatic grading with sandboxed code execution, live polls."
site_author = "Yves Chevallier"
site_url = "https://heig-tin-info.github.io/heig-quiz/"
repo_url = "https://github.com/heig-tin-info/heig-quiz"
copyright = """
Copyright &copy; 2026 HEIG-VD, TIN department
"""

# Everything on the site is in English (CLAUDE.md, invariant 1): the product
# specification was translated from its French original and lives under
# Development, next to the decision records and the archived MVP plan. The
# Guide is the user documentation of the platform; its screenshots come in a
# light and a dark variant (docs/development/screenshots.md).
