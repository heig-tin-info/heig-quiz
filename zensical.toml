[project]
site_name = "HEIG Quiz"
site_description = "A quiz platform for HEIG-VD teachers: question pools, live evaluations with a server-side clock, automatic grading with sandboxed code execution, live polls."
site_author = "Yves Chevallier"
site_url = "https://heig-tin-info.github.io/heig-quiz/"
repo_url = "https://github.com/heig-tin-info/heig-quiz"
copyright = """
Copyright &copy; 2026 HEIG-VD, TIN department
"""

# Everything on the site is in English (CLAUDE.md, invariant 1): the product
# specification was translated from its French original and lives under
# Development, next to the decision records and the archived MVP plan. The
# Guide is the user documentation of the platform; its screenshots come in a
# light and a dark variant (docs/development/screenshots.md).
nav = [
  { "Home" = "index.md" },
  { "Guide" = [
    { "Overview" = "guide/index.md" },
    { "Getting started" = "guide/getting-started.md" },
    { "Courses and classrooms" = "guide/classrooms.md" },
    { "Question pools" = "guide/pools.md" },
    { "Question types" = "guide/question-types.md" },
    { "Parameterized questions" = "guide/parameterized-questions.md" },
    { "Evaluations" = "guide/evaluations.md" },
    { "Running an evaluation" = "guide/live.md" },
    { "Grading and results" = "guide/grading.md" },
    { "Live polls" = "guide/polls.md" },
    { "AI assistants (MCP)" = "guide/assistants.md" },
    { "For students" = "guide/students.md" },
    { "Administration" = "guide/admin.md" },
    { "Data protection" = "guide/data-protection.md" },
  ] },
  { "Development" = [
    { "Local setup" = "development/index.md" },
    { "Repository layout" = "development/repository.md" },
    { "Deployment" = "development/deployment.md" },
    { "Microsoft Teams setup" = "development/teams.md" },
    { "Kiosk stations (Chromebooks)" = "kiosk.md" },
    { "Architecture" = "development/architecture.md" },
    { "Writing the documentation" = "development/documentation.md" },
    { "Screenshots" = "development/screenshots.md" },
    { "Specification" = [
      { "0. Scope and objectives" = "spec/00-cadre-et-perimetre.md" },
      { "1. Glossary and domain model" = "spec/01-glossaire-et-domaine.md" },
      { "2. Functional requirements" = "spec/02-exigences-fonctionnelles.md" },
      { "3. Non-functional requirements" = "spec/03-exigences-non-fonctionnelles.md" },
      { "4. Question types" = "spec/04-types-de-questions.md" },
      { "5. Architecture" = "spec/05-architecture.md" },
      { "6. Open questions" = "spec/06-questions-ouvertes.md" },
      { "7. Reuse of heig-classroom" = "spec/07-reutilisation-heig-classroom.md" },
      { "8. Two-level experience" = "spec/08-experience-deux-niveaux.md" },
    ] },
    { "Decisions" = "adr/README.md" },
    { "Classroom merge" = [
      { "Overview" = "merge/README.md" },
      { "Progress" = "merge/PROGRESS.md" },
      { "1. Strategy" = "merge/01-strategy.md" },
      { "2. Data and migration" = "merge/02-data-and-migration.md" },
      { "3. GitHub and projects" = "merge/03-github-projects.md" },
      { "4. Journal" = "merge/04-journal.md" },
      { "5. Web" = "merge/05-web.md" },
      { "6. Workspace, SEB, infrastructure" = "merge/06-codespace-seb-infra.md" },
      { "7. Incompatibilities" = "merge/07-incompatibilities.md" },
      { "8. Decisions" = "merge/08-decisions.md" },
      { "9. Task cards" = "merge/09-tasks.md" },
      { "Production measurements" = "merge/measures-2026-09-28.md" },
    ] },
    { "Archive" = [
      { "MVP plan (phase 1)" = "PLAN-MVP.md" },
    ] },
  ] },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "navigation.tabs",
  "navigation.sections",
  "content.footnote.tooltips",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[project.theme.icon]
logo = "lucide/list-checks"

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/heig-tin-info/heig-quiz"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
