# Production.
# Caddy runs NATIVELY on the host (see deploy.md): only loopback ports are
# published here. Start with:
#   docker compose -f compose.prod.yml --env-file .env.prod up -d
#
# Production uses a REAL PostgreSQL. The embedded pglite database of `pnpm dev`
# is refused by config.ts under NODE_ENV=production, and pg-boss needs a real
# server anyway. No Keycloak here: it is a development identity provider.
# No runner service yet (docs/spec/05-architecture.md, 5.5).
services:
  app:
    # Image built in CI and pulled from GHCR -- never built on the VM.
    # Rollback: IMAGE_TAG=<commit sha> docker compose ... up -d
    image: ghcr.io/heig-tin-info/quiz:${IMAGE_TAG:-latest}
    restart: always
    env_file: .env.prod
    environment:
      DATABASE_URL: postgres://quiz:${POSTGRES_PASSWORD:?}@postgres:5432/quiz
      PUBLIC_URL: https://quiz.example.ch
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000" # native Caddy -> reverse_proxy localhost:3000
    volumes:
      - ./secrets:/app/secrets:ro
      - ./assets:/app/assets
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: quiz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: quiz
    # Tuned for a small VM: correctness over throughput. These are runtime
    # GUCs (no re-init, data untouched).
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=192MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - work_mem=4MB
      - -c
      - max_connections=40
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quiz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Daily pg_dump to ./backups; 30-day retention. The OFF-VM copy (rclone to
  # object storage) still needs wiring -- see deploy.md, Backups.
  backup:
    image: postgres:17
    restart: always
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - bash
      - -c
      - |
        while true; do
          pg_dump -Fc -h postgres -U quiz quiz > "/backups/quiz-$(date +%F).dump.tmp" \
            && mv "/backups/quiz-$(date +%F).dump.tmp" "/backups/quiz-$(date +%F).dump"
          ls -1t /backups/quiz-*.dump 2>/dev/null | tail -n +31 | xargs -r rm --
          sleep 86400
        done

volumes:
  pgdata:
