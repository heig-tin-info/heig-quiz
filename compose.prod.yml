# Production -- quiz.chevallier.io, on the VM it shares with heig-classroom
# and evaluation-tb (ADR-016). Caddy runs NATIVELY on the host and imports
# one fragment per service from /etc/caddy/conf.d/: only loopback ports are
# published here, and 3002 because 3000 and 3001 belong to the neighbours.
# Start with:
#   docker compose -f compose.prod.yml --env-file .env.prod up -d
#
# Production uses a REAL PostgreSQL. The embedded pglite database of `pnpm dev`
# is refused by config.ts under NODE_ENV=production, and pg-boss needs a real
# server anyway. No Keycloak here: it is a development identity provider.
#
# The code runner is NOT in this file: it runs on the code VM, behind its own
# Caddy, and the API reaches it over HTTPS with the shared RUNNER_TOKEN of
# .env.prod (apps/runner/deploy/, docs/development/deployment.md §3).
services:
  app:
    # Image built in CI and pulled from GHCR -- never built on the VM.
    # Rollback: IMAGE_TAG=<commit sha> docker compose ... up -d
    image: ghcr.io/heig-tin-info/quiz:${IMAGE_TAG:-latest}
    restart: always
    env_file: .env.prod
    environment:
      DATABASE_URL: postgres://quiz:${POSTGRES_PASSWORD:?}@postgres:5432/quiz
      PUBLIC_URL: https://quiz.chevallier.io
      NODE_ENV: production
      # The bind mount below; the default (`.data/assets`, relative to /app)
      # would live inside the container and vanish with it.
      ASSETS_DIR: /app/assets
      # The backup service's report of its last dump (ADR-055), read by the
      # system status and /healthz. Only the report: the dumps themselves
      # are never mounted into this internet-facing container (N-DATA-03).
      BACKUP_STATUS_FILE: /app/backup-status/last.json
    ports:
      - "127.0.0.1:3002:3000" # native Caddy -> reverse_proxy localhost:3002
    volumes:
      - ./secrets:/app/secrets:ro
      # Uploaded question images, content-addressed: a backup is an rsync.
      # Owned by uid 1000 on the host (`node` in the image).
      - ./assets:/app/assets
      # Written by `backup` (container root), read-only here (docs/development/deployment.md §6).
      - ./backup-status:/app/backup-status:ro
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: quiz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: quiz
    # The VM is 1 vCPU / 2 GB + 2 GB swap, shared by three services and two
    # PostgreSQL instances (this one and the classroom's, ~50 MB each), kept
    # separate on purpose so each service stays movable and restorable alone:
    # the same tuning as the classroom's (correctness over throughput). Runtime
    # GUCs, no re-init, data untouched. max_connections 40 fits app(10)+
    # pg-boss(10)+backup with headroom; parallel query is pointless on one vCPU.
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - effective_cache_size=96MB
      - -c
      - maintenance_work_mem=16MB
      - -c
      - work_mem=2MB
      - -c
      - max_connections=40
      - -c
      - max_worker_processes=2
      - -c
      - max_parallel_workers=0
      - -c
      - max_parallel_workers_per_gather=0
      - -c
      - max_parallel_maintenance_workers=0
      - -c
      - autovacuum_max_workers=1
      - -c
      - wal_buffers=2MB
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quiz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Daily pg_dump to ./backups; 30-day retention. The off-VM copy is a host
  # timer (borg to a Storage Box): docs/development/deployment.md §6.
  # After each dump, a one-line report in ./backup-status/last.json (when it
  # finished, whether it worked, the file and its size), written through a
  # temporary file so the app never reads half of it (ADR-055). `$$` is a
  # literal `$` for the shell: compose would interpolate a single one.
  backup:
    image: postgres:17
    restart: always
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - ./backups:/backups
      - ./backup-status:/backup-status
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - bash
      - -c
      - |
        while true; do
          file="quiz-$$(date +%F).dump"
          if pg_dump -Fc -h postgres -U quiz quiz > "/backups/$$file.tmp" \
            && mv "/backups/$$file.tmp" "/backups/$$file"; then
            code=0; ok=true; size=$$(stat -c %s "/backups/$$file")
          else
            code=$$?; ok=false; size=0; rm -f "/backups/$$file.tmp"
          fi
          printf '{"finished_at":"%s","ok":%s,"exit_code":%d,"file":"%s","size_bytes":%d}\n' \
            "$$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$$ok" "$$code" "$$file" "$$size" \
            > /backup-status/last.json.tmp && mv /backup-status/last.json.tmp /backup-status/last.json
          ls -1t /backups/quiz-*.dump 2>/dev/null | tail -n +31 | xargs -r rm --
          sleep 86400
        done

volumes:
  pgdata:
