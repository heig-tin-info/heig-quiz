# Production.
# Caddy runs NATIVELY on the host (see deploy.md): only loopback ports are
# published here. Start with:
#   docker compose -f compose.prod.yml --env-file .env.prod up -d
#
# Production uses a REAL PostgreSQL. The embedded pglite database of `pnpm dev`
# is refused by config.ts under NODE_ENV=production, and pg-boss needs a real
# server anyway. No Keycloak here: it is a development identity provider.
# The `runner` service (docs/spec/05-architecture.md, 5.5) drives the HOST's
# ROOTFUL Podman over the socket mounted below. It is on the internal compose
# network only: Caddy never routes to it and no port of it is published.
services:
  app:
    # Image built in CI and pulled from GHCR -- never built on the VM.
    # Rollback: IMAGE_TAG=<commit sha> docker compose ... up -d
    image: ghcr.io/heig-tin-info/quiz:${IMAGE_TAG:-latest}
    restart: always
    env_file: .env.prod
    environment:
      DATABASE_URL: postgres://quiz:${POSTGRES_PASSWORD:?}@postgres:5432/quiz
      PUBLIC_URL: https://quiz.example.ch
      NODE_ENV: production
      # The runner is reached by its compose service name. Drop these two and
      # the platform falls back to RUNNER_MODE=stub: code questions are still
      # authorable, playable and releasable, and their grading is proposed for
      # a manual review (decision D14).
      RUNNER_MODE: http
      RUNNER_URL: http://runner:3200
    ports:
      - "127.0.0.1:3000:3000" # native Caddy -> reverse_proxy localhost:3000
    volumes:
      - ./secrets:/app/secrets:ro
      - ./assets:/app/assets
    depends_on:
      postgres:
        condition: service_healthy

  # Code execution. Holds no secret, reaches no database, and is never
  # published: `deploy.md` § Runner has the host-side recipe (rootful Podman,
  # the socket, and `apps/runner/images/build.sh` for the language images).
  runner:
    image: ghcr.io/heig-tin-info/quiz-runner:${IMAGE_TAG:-latest}
    restart: always
    environment:
      # Rootful, so `--userns=auto` is always available: no probe at startup.
      RUNNER_USERNS_AUTO: "true"
      PODMAN_SOCKET: /run/podman/podman.sock
      RUNNER_CONCURRENCY: ${RUNNER_CONCURRENCY:-4}
      RUNNER_QUEUE_MAX: ${RUNNER_QUEUE_MAX:-32}
    volumes:
      # The ONLY thing this container gets from the host. The containers it
      # then starts mount nothing at all.
      - /run/podman/podman.sock:/run/podman/podman.sock
    # No `ports:` on purpose: internal network only, never exposed by Caddy.

  postgres:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: quiz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: quiz
    # Tuned for a small VM: correctness over throughput. These are runtime
    # GUCs (no re-init, data untouched).
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=192MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - work_mem=4MB
      - -c
      - max_connections=40
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quiz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Daily pg_dump to ./backups; 30-day retention. The OFF-VM copy (rclone to
  # object storage) still needs wiring -- see deploy.md, Backups.
  backup:
    image: postgres:17
    restart: always
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - bash
      - -c
      - |
        while true; do
          pg_dump -Fc -h postgres -U quiz quiz > "/backups/quiz-$(date +%F).dump.tmp" \
            && mv "/backups/quiz-$(date +%F).dump.tmp" "/backups/quiz-$(date +%F).dump"
          ls -1t /backups/quiz-*.dump 2>/dev/null | tail -n +31 | xargs -r rm --
          sleep 86400
        done

volumes:
  pgdata:
